        ${rf('US Invoice No',`srv_usInvoiceNo_${i}`,l.usInvoiceNo,l.conf?.usInvoiceNo)}
        ${rf('Heat No',`srv_heatNo_${i}`,l.heatNo,l.conf?.heatNo)}
      </div>
    </div>`).join('');

    reviewStep=`<div class="import-step active">
      <div style="background:var(--success-l);border:1px solid #bbf7d0;border-radius:var(--rs);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--success);display:flex;align-items:center;gap:8px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Extraction complete. Review and correct fields below, then click Apply to Form.
      </div>
      <div class="review-section">
        <div class="review-section-title">🚢 Shipment Header</div>
        <div class="review-grid">
          ${rf('Shipping Invoice No','srv_invoiceNo',d.shippingInvoiceNo,d.conf?.shippingInvoiceNo)}
          ${rf('GST Invoice No','srv_gstInvoiceNo',d.gstInvoiceNo,d.conf?.gstInvoiceNo)}
          ${rdf('Date of Invoice','srv_dateOfInvoice',d.dateOfInvoice,d.conf?.dateOfInvoice)}
          ${rdf('Date of Shipping','srv_dateOfShipping',d.dateOfShipping,d.conf?.dateOfShipping)}
          ${rf('Transport Method','srv_transportMethod',d.transportMethod,d.conf?.transportMethod)}
          ${rf('Logistics','srv_logistics',d.logistics,d.conf?.logistics)}
          ${rf('Tracking # / Airwaybill No','srv_trackingNo',d.trackingNo,d.conf?.trackingNo)}
          ${rf('Customs House Agent','srv_cha',d.customsHouseAgent,d.conf?.customsHouseAgent)}
          ${rsf('Location','srv_location',d.location,d.conf?.location,LOCATIONS)}
        </div>
      </div>
      <div class="review-section">
        <div class="review-lines-header">
          <div class="review-section-title" style="margin-bottom:0">📦 Line Items <span class="badge b-gray" style="font-size:11px">${(d.lines||[]).length} extracted</span></div>
        </div>
        ${linesHTML||'<p style="font-size:12px;color:var(--muted);margin-top:8px">No line items extracted. You can add them manually after applying.</p>'}
      </div>
    </div>`;
  }

  const footerBtns=SHIP_IMP.step==='upload'
    ?`<button class="btn btn-secondary" id="shipImportCancelBtn2">Cancel</button><button class="btn btn-purple" id="shipImportExtractBtn">Extract with Claude →</button>`
    :SHIP_IMP.step==='review'
    ?`<button class="btn btn-secondary" id="shipImportCancelBtn2">Cancel</button><button class="btn btn-secondary" id="shipImportBackBtn">← Re-upload</button><button class="btn btn-primary" id="shipImportApplyBtn">✓ Apply to Form</button>`
    :SHIP_IMP.step==='error'
    ?`<button class="btn btn-secondary" id="shipImportCancelBtn2">Close</button>`
    :'';

  return`<div class="import-modal-overlay" id="shipImportModalOverlay">
    <div class="import-modal">
      <div class="import-modal-header">
        <h3>📄 Import Shipment Document</h3>
        <button class="import-close" id="shipImportCancelBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="import-body">
        ${uploadStep}${processingStep}${errorStep}${reviewStep}
        ${SHIP_IMP.step!=='processing'?`<div class="import-actions">${footerBtns}</div>`:''}
      </div>
    </div>
  </div>`;
}

function openShipImport(){SHIP_IMP={open:true,step:'upload',file:null,extracted:null,error:null,apiKey:SHIP_IMP.apiKey||''};showShipImportModal();}
function closeShipImport(){const el=document.getElementById('shipImportModalOverlay');if(el)el.remove();SHIP_IMP.open=false;}
function showShipImportModal(){const ex=document.getElementById('shipImportModalOverlay');if(ex)ex.remove();document.body.insertAdjacentHTML('beforeend',shipImportModalHTML());bindShipImportModal();}

async function extractShipmentWithClaude(file){
  const base64=await toBase64(file);
  const isPDF=file.type==='application/pdf';
  const mediaType=isPDF?'application/pdf':file.type;
  const systemPrompt=`You are a shipment document extraction assistant. Extract structured data from the document and return ONLY valid JSON with no markdown, no backticks, no preamble. Return this exact structure:
{"shippingInvoiceNo":null,"gstInvoiceNo":null,"dateOfInvoice":null,"dateOfShipping":null,"transportMethod":null,"logistics":null,"trackingNo":null,"customsHouseAgent":null,"location":null,"lines":[{"customerPONo":null,"partNo":null,"shippedQty":null,"shippedTo":null,"deliveryStatus":null,"deliveryDate":null,"usInvoiceNo":null,"heatNo":null,"conf":{"customerPONo":"high|low|null","partNo":"high|low|null","shippedQty":"high|low|null","shippedTo":"high|low|null","deliveryStatus":"high|low|null","deliveryDate":"high|low|null","usInvoiceNo":"high|low|null","heatNo":"high|low|null"}}],"conf":{"shippingInvoiceNo":"high|low|null","gstInvoiceNo":"high|low|null","dateOfInvoice":"high|low|null","dateOfShipping":"high|low|null","transportMethod":"high|low|null","logistics":"high|low|null","trackingNo":"high|low|null","customsHouseAgent":"high|low|null","location":"high|low|null"}}
Dates must be YYYY-MM-DD. location must be one of: India, SAT. deliveryStatus must be one of: In Transit, Delivered. Use "high" confidence for clearly printed fields, "low" for handwritten/ambiguous, null if not found.`;
  const userContent=isPDF
    ?[{type:'document',source:{type:'base64',media_type:mediaType,data:base64}},{type:'text',text:'Extract all shipment fields from this document.'}]
    :[{type:'image',source:{type:'base64',media_type:mediaType,data:base64}},{type:'text',text:'Extract all shipment fields from this document.'}];
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,system:systemPrompt,messages:[{role:'user',content:userContent}]})});
  if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err?.error?.message||`API error ${res.status}`);}
  const data=await res.json();
  const text=data.content?.map(b=>b.text||'').join('')||'';
  const clean=text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
}

function bindShipImportModal(){
  document.getElementById('shipImportCancelBtn')?.addEventListener('click',closeShipImport);
  document.getElementById('shipImportCancelBtn2')?.addEventListener('click',closeShipImport);
  document.getElementById('shipImportModalOverlay')?.addEventListener('click',e=>{if(e.target.id==='shipImportModalOverlay')closeShipImport();});
  const dz=document.getElementById('shipImportDropZone');
  if(dz){
    dz.addEventListener('click',()=>document.getElementById('shipImportFileInput')?.click());
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
    dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');const f=e.dataTransfer.files[0];if(f){SHIP_IMP.file=f;updateShipDropZoneLabel(f.name);}});
  }
  document.getElementById('shipImportFileInput')?.addEventListener('change',e=>{const f=e.target.files[0];if(f){SHIP_IMP.file=f;updateShipDropZoneLabel(f.name);}});
  document.getElementById('shipImportExtractBtn')?.addEventListener('click',async()=>{
    if(!SHIP_IMP.file){notice('Please select a file first.','warn');return;}
    SHIP_IMP.step='processing';showShipImportModal();
    try{SHIP_IMP.extracted=await extractShipmentWithClaude(SHIP_IMP.file);SHIP_IMP.step='review';}
    catch(err){SHIP_IMP.error=err.message;SHIP_IMP.step='error';}
    showShipImportModal();
  });
  document.getElementById('shipImportRetryBtn')?.addEventListener('click',()=>{SHIP_IMP.step='upload';SHIP_IMP.error=null;showShipImportModal();});
  document.getElementById('shipImportBackBtn')?.addEventListener('click',()=>{SHIP_IMP.step='upload';SHIP_IMP.extracted=null;showShipImportModal();});
  document.getElementById('shipImportApplyBtn')?.addEventListener('click',()=>{
    const d=SHIP_IMP.extracted||{};
    const lines=(d.lines||[]).map((l,i)=>({
      ...emptyShipLine(i+1),
      customerPONo:document.getElementById(`srv_cpo_${i}`)?.value||l.customerPONo||'',
      partNo:document.getElementById(`srv_partNo_${i}`)?.value||l.partNo||'',
      shippedQty:parseFloat(document.getElementById(`srv_shippedQty_${i}`)?.value)||0,
      shippedTo:document.getElementById(`srv_shippedTo_${i}`)?.value||l.shippedTo||'',
      deliveryStatus:document.getElementById(`srv_deliveryStatus_${i}`)?.value||l.deliveryStatus||'In Transit',
      deliveryDate:document.getElementById(`srv_deliveryDate_${i}`)?.value||l.deliveryDate||'',
      usInvoiceNo:document.getElementById(`srv_usInvoiceNo_${i}`)?.value||l.usInvoiceNo||'',
      heatNo:document.getElementById(`srv_heatNo_${i}`)?.value||l.heatNo||''
    }));
    S.editingShipment={
      id:null,
      shippingInvoiceNo:document.getElementById('srv_invoiceNo')?.value||d.shippingInvoiceNo||'',
      gstInvoiceNo:document.getElementById('srv_gstInvoiceNo')?.value||d.gstInvoiceNo||'',
      dateOfInvoice:document.getElementById('srv_dateOfInvoice')?.value||d.dateOfInvoice||today(),
      dateOfShipping:document.getElementById('srv_dateOfShipping')?.value||d.dateOfShipping||today(),
      transportMethod:document.getElementById('srv_transportMethod')?.value||d.transportMethod||'',
      logistics:document.getElementById('srv_logistics')?.value||d.logistics||'',
      trackingNo:document.getElementById('srv_trackingNo')?.value||d.trackingNo||'',
      customsHouseAgent:document.getElementById('srv_cha')?.value||d.customsHouseAgent||'',
      location:document.getElementById('srv_location')?.value||d.location||'India',
      kanban:false,
      lines:lines.length>0?lines:[emptyShipLine(1)]
    };
    S.page='new-shipment';
    closeShipImport();
    render();
  });
}
function updateShipDropZoneLabel(name){const dz=document.getElementById('shipImportDropZone');if(!dz)return;const h4=dz.querySelector('h4');const p=dz.querySelector('p');if(h4)h4.textContent=name;if(p)p.textContent='File selected — click "Extract with Claude →" to proceed';dz.style.borderColor='var(--success)';dz.style.background='var(--success-l)';}
</script>
</body>
