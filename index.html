<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentco — PO Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   MENTCO PO MANAGER v9 — DESIGN SYSTEM
   ═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Core palette */
  --bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#FAFAFA;
  --border:#E4E7EC;--border-soft:#EEF0F4;
  --text:#0F172A;--muted:#64748B;--light:#94A3B8;

  /* Accent — Mentco steel blue */
  --accent:#1F4E8C;--accent-d:#155EA0;--accent-l:#EBF3FC;--accent-mid:#BFDBFE;

  /* Sidebar — dark navy */
  --sb-bg:#0B1829;--sb-border:#1E2D3D;--sb-text:#94A3B8;--sb-text-active:#E2E8F0;
  --sb-hover:#142236;--sb-active-bg:#1E3A5F;--sb-active-accent:#3B9EFF;
  --sb-section:#475569;

  /* Semantic */
  --danger:#DC2626;--danger-l:#FEF2F2;--danger-mid:#FECACA;
  --success:#16A34A;--success-l:#F0FDF4;--success-mid:#BBF7D0;
  --warn:#D97706;--warn-l:#FFFBEB;--warn-mid:#FDE68A;
  --purple:#6D28D9;--purple-l:#F5F3FF;--purple-mid:#DDD6FE;
  --info:#0EA5E9;--info-l:#F0F9FF;

  /* Spacing & shape */
  --r:10px;--rs:7px;--r-sm:5px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.06);
}

/* ── FONTS ── */
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,.sora{font-family:Inter,sans-serif}
.mono{font-family:Inter,sans-serif}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s ease;white-space:nowrap;letter-spacing:.01em}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 1px 3px rgba(30,111,194,.3)}
.btn-primary:hover{background:var(--accent-d);box-shadow:0 2px 6px rgba(30,111,194,.4)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border);box-shadow:var(--shadow-sm)}
.btn-secondary:hover{background:var(--bg);border-color:#CBD5E1}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 1px 3px rgba(220,38,38,.25)}.btn-danger:hover{background:#B91C1C}
.btn-success{background:var(--success);color:#fff;box-shadow:0 1px 3px rgba(22,163,74,.25)}.btn-success:hover{background:#15803D}
.btn-purple{background:var(--purple);color:#fff;box-shadow:0 1px 3px rgba(109,40,217,.25)}.btn-purple:hover{background:#5B21B6}
.btn-warn{background:var(--warn);color:#fff;box-shadow:0 1px 3px rgba(217,119,6,.25)}.btn-warn:hover{background:#B45309}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-full{width:100%;justify-content:center}

/* ── LOGIN — SPLIT SCREEN ── */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-panel-left{background:var(--sb-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;position:relative;overflow:hidden}
.login-panel-left::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(30,111,194,.25) 0%,transparent 70%);top:-200px;left:-200px;pointer-events:none}
.login-panel-left::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(59,158,255,.12) 0%,transparent 70%);bottom:-100px;right:-100px;pointer-events:none}
.login-left-content{position:relative;z-index:1;text-align:center;max-width:360px}
.login-left-globe{width:80px;height:80px;background:rgba(30,111,194,.3);border:1px solid rgba(59,158,255,.3);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;backdrop-filter:blur(10px)}
.login-left-tagline{font-family:Inter,sans-serif;font-size:28px;font-weight:600;color:#E2E8F0;line-height:1.3;margin-bottom:12px}
.login-left-sub{font-size:14px;color:#64748B;line-height:1.6}
.login-left-dots{display:flex;gap:8px;justify-content:center;margin-top:36px}
.login-left-dots span{width:6px;height:6px;border-radius:50%;background:rgba(59,158,255,.3)}
.login-left-dots span:first-child{background:rgba(59,158,255,.8);width:20px;border-radius:3px}
.login-version{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:11px;color:var(--sb-section);font-family:Inter,sans-serif}
.login-panel-right{display:flex;align-items:center;justify-content:center;padding:48px;background:var(--surface)}
.login-card{width:100%;max-width:400px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.login-logo img{height:36px;object-fit:contain}
.login-logo-text{font-family:Inter,sans-serif;font-size:20px;font-weight:600;color:var(--text)}
.login-logo span{font-size:18px;font-weight:600}
.login-title{font-family:Inter,sans-serif;font-size:26px;font-weight:600;color:var(--text);margin-bottom:6px}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.fgrp{margin-bottom:16px}
.flabel{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.finput{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:14px;outline:none;transition:all .15s;color:var(--text)}
.finput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.login-err{background:var(--danger-l);border:1px solid var(--danger-mid);color:var(--danger);font-size:12px;padding:10px 14px;border-radius:var(--rs);margin-bottom:14px;display:none}
.login-hint{margin-top:20px;padding:14px;background:var(--bg);border-radius:var(--rs);border:1px solid var(--border);font-size:11px;color:var(--muted)}
.login-hint b{display:block;margin-bottom:5px;font-size:12px;color:var(--text)}
.login-hint span{display:block;font-family:Inter,sans-serif;padding:2px 0;font-size:11px}

/* ── APP SHELL ── */
.app{display:flex;min-height:100vh}

/* ── SIDEBAR — DARK NAVY ── */
.sidebar{width:232px;background:var(--sb-bg);border-right:1px solid var(--sb-border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:width .2s ease}
.sidebar.collapsed{width:56px}
.sidebar.collapsed .sb-logo-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-badge,.sidebar.collapsed .nav-section-label,.sidebar.collapsed .user-info,.sidebar.collapsed .collapse-label{display:none}
.sidebar.collapsed .sb-logo{justify-content:center;padding:16px 0}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px 0}
.sidebar.collapsed .sb-footer{padding:8px 0;align-items:center}
.sidebar.collapsed .user-row{justify-content:center;padding:8px 0}
.sidebar.collapsed .logout-btn{padding:6px}

.sb-logo{padding:16px 16px;border-bottom:1px solid var(--sb-border);display:flex;align-items:center;gap:10px;min-height:60px}
.sb-logo-icon{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sb-logo-text{font-family:Inter,sans-serif;font-size:14px;font-weight:600;color:var(--sb-text-active);white-space:nowrap}

.sb-nav{flex:1;padding:10px 8px;overflow-y:auto;overflow-x:hidden}
.sb-nav::-webkit-scrollbar{width:3px}.sb-nav::-webkit-scrollbar-track{background:transparent}.sb-nav::-webkit-scrollbar-thumb{background:var(--sb-border);border-radius:2px}

.nav-section-label{font-size:11px;font-weight:600;color:var(--sb-section);text-transform:uppercase;letter-spacing:.8px;padding:12px 10px 4px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--sb-text);font-size:13px;font-weight:500;transition:all .14s;margin-bottom:1px;user-select:none;white-space:nowrap;position:relative}
.nav-item:hover{background:var(--sb-hover);color:var(--sb-text-active)}
.nav-item.active{background:var(--sb-active-bg);color:var(--sb-active-accent)}
.nav-item.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;background:var(--sb-active-accent);border-radius:0 2px 2px 0}
.nav-item svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;flex-shrink:0}
.nav-label{flex:1;min-width:0}
.nav-badge{background:var(--sb-active-accent);color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
.nav-badge.warn{background:var(--warn)}

.sb-footer{padding:10px 8px;border-top:1px solid var(--sb-border)}
.sb-collapse-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--sb-text);font-size:12px;font-weight:500;transition:all .14s;margin-bottom:6px;border:none;background:none;width:100%;font-family:inherit}
.sb-collapse-btn:hover{background:var(--sb-hover);color:var(--sb-text-active)}
.sb-collapse-btn svg{width:16px;height:16px;flex-shrink:0;transition:transform .2s}
.sidebar.collapsed .sb-collapse-btn svg{transform:rotate(180deg)}

.user-row{display:flex;align-items:center;gap:9px;padding:7px 10px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-d) 100%);display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;border:2px solid rgba(59,158,255,.3)}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sb-text-active)}
.user-role-lbl{font-size:11px;color:var(--sb-section)}
.logout-btn{background:none;border:none;cursor:pointer;color:var(--sb-text);padding:5px;border-radius:6px;display:flex;align-items:center;transition:color .15s;flex-shrink:0}
.logout-btn:hover{color:#F87171}

/* ── MAIN CONTENT ── */
.main{margin-left:232px;flex:1;display:flex;flex-direction:column;height:100vh;overflow-y:auto;transition:margin-left .2s ease}
.main.expanded{margin-left:56px;height:100vh;overflow-y:auto}
/* Phone / narrow screens: menu starts collapsed, grids stack, wide tables scroll sideways */
@media(max-width:700px){
  [style*="grid-template-columns"]{grid-template-columns:1fr 1fr !important}
  .toolbar,.toolbar-left{flex-wrap:wrap}
  .search-box{min-width:0;flex:1 1 100%}
  .table-wrap,.tbl-wrap,.card-body{overflow-x:auto}
  .modal,.modal-box{max-width:96vw !important}
  .wiz-shell{grid-template-columns:1fr !important}
  .wiz-summary{position:static !important}
  .wiz-step-label{display:none}
  .grid3,.stats-grid,.fp-grid-4,.fp-grid-3,.fp-grid-2,.dash-grid-2{grid-template-columns:1fr 1fr !important}
  .audit-entry{grid-template-columns:1fr !important}
}
@media(max-width:480px){[style*="grid-template-columns"],.grid3,.stats-grid,.fp-grid-4,.fp-grid-3,.fp-grid-2,.dash-grid-2{grid-template-columns:1fr !important}}

/* ── TOPBAR ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 var(--border)}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-title{font-family:Inter,sans-serif;font-size:16px;font-weight:600;color:var(--text)}
.topbar-breadcrumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.topbar-breadcrumb span{color:var(--light)}
.topbar-right{display:flex;align-items:center;gap:10px}

/* ── ALERT STRIP ── */
.alert-strip{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(90deg,var(--warn-l) 0%,#FFF7ED 100%);border:1px solid var(--warn-mid);border-radius:var(--rs);margin-bottom:16px;font-size:13px}
.alert-strip svg{flex-shrink:0;color:var(--warn)}
.alert-strip-text{flex:1;color:#92400E;font-weight:500}
.alert-strip-link{font-size:12px;color:var(--warn);font-weight:600;cursor:pointer;text-decoration:underline;white-space:nowrap}

/* ── PAGE CONTENT ── */
.content{padding:24px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.01em}
.b-blue{background:var(--accent-l);color:var(--accent)}
.b-green{background:var(--success-l);color:var(--success)}
.b-yellow{background:var(--warn-l);color:var(--warn)}
.b-gray{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.b-red{background:var(--danger-l);color:var(--danger)}
.b-purple{background:var(--purple-l);color:var(--purple)}
.b-warn{background:var(--warn-l);color:var(--warn)}
.b-dark{background:#0F172A;color:#E2E8F0}

/* ── RISK DOTS ── */
.risk-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.risk-dot.red{background:var(--danger)}
.risk-dot.yellow{background:var(--warn)}
.risk-dot.green{background:var(--success)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.stat-card:hover{box-shadow:var(--shadow)}
.stat-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.stat-value{font-family:Inter,sans-serif;font-size:28px;font-weight:600;letter-spacing:-.8px;margin-bottom:4px;color:var(--text)}
.stat-sub{font-size:12px;color:var(--muted)}
.dash-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-sm)}
.chart-title{font-family:Inter,sans-serif;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chart-subtitle{font-size:11px;color:var(--muted);font-weight:400;font-family:'Inter',sans-serif}
.bar-chart{display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{font-size:12px;color:var(--muted);width:110px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent)}
.bar-val{font-size:11px;font-family:Inter,sans-serif;color:var(--muted);width:70px;text-align:right;flex-shrink:0}
.mini-table{width:100%;border-collapse:collapse}
.mini-table th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
.mini-table td{padding:8px 10px;font-size:12px;border-bottom:1px solid var(--border-soft)}
.mini-table tr:last-child td{border-bottom:none}
.mini-table tr:hover td{background:var(--bg)}
.month-bars{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px}
.month-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.month-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px}
.month-label{font-size:11px;color:var(--muted)}
.aging-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.aging-box{padding:10px;border-radius:var(--rs);text-align:center}
.aging-bar{display:flex;gap:2px;height:24px;border-radius:4px;overflow:hidden;margin-top:8px}
.aging-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.toolbar-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rs);padding:8px 13px;box-shadow:var(--shadow-sm);transition:border-color .15s}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.search-box input{border:none;outline:none;font-family:inherit;font-size:13px;background:transparent;width:160px;color:var(--text)}
.search-box input::placeholder{color:var(--light)}
.search-box svg{width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:2;flex-shrink:0}
/* quick stats strip */
.qs-strip{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.qs-item{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);transition:all .14s}
.qs-item:hover,.qs-item.active{border-color:var(--accent);background:var(--accent-l);color:var(--accent)}
.qs-item span{font-weight:600;margin-left:3px}
/* filter panel */
.filter-panel{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;display:none;box-shadow:var(--shadow-sm)}
.filter-panel.open{display:block}
.fp-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px}
.fp-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.fp-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.fp-grid-2{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.fg-f{display:flex;flex-direction:column;gap:5px}
.fg-f label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fg-f select,.fg-f input{padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:13px;background:var(--surface);color:var(--text);outline:none;width:100%}
.fg-f select:focus,.fg-f input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-l)}
.fp-actions{display:flex;gap:8px}
/* multi-select */
.ms-wrap{position:relative;user-select:none}
.ms-trigger{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:13px;background:var(--surface);cursor:pointer;min-height:35px;color:var(--text);transition:border-color .14s}
.ms-trigger:hover{border-color:#94A3B8}
.ms-trigger.active{border-color:var(--accent);background:var(--accent-l)}
.ms-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rs);box-shadow:var(--shadow-lg);z-index:200;max-height:200px;overflow-y:auto;min-width:160px}
.ms-item{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;cursor:pointer;transition:background .1s}
.ms-item:hover{background:var(--bg)}
.ms-item input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--accent)}
.ms-item label{cursor:pointer;flex:1}
.ms-select-all{border-bottom:1px solid var(--border-soft);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.ms-tag{display:inline-flex;align-items:center;gap:3px;background:var(--accent-l);color:var(--accent);border-radius:10px;padding:1px 6px;font-size:11px;font-weight:500;margin:1px}
.ms-tag.purple{background:var(--purple-l);color:var(--purple)}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-l);color:var(--accent);border:1px solid var(--accent-mid);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:500}
.filter-chip.ship-chip{background:var(--purple-l);color:var(--purple);border-color:var(--purple-mid)}
.filter-chip button{background:none;border:none;cursor:pointer;color:inherit;font-size:14px;line-height:1;padding:0}
/* DATA TABLES */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow-sm)}
.dt{width:100%;border-collapse:collapse;min-width:600px}
.dt thead{position:sticky;top:0;z-index:5}
.dt th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:11px 14px;text-align:left;border-bottom:1.5px solid var(--border);background:var(--surface-2);white-space:nowrap}
.dt td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.table-wrap.tall{max-height:calc(100vh - 230px)}
.dt th.sortable{cursor:pointer;user-select:none}
.dt th.sortable:hover{color:var(--accent)}
.clickable{cursor:pointer}
.stat-card.clickable:hover{box-shadow:0 4px 14px rgba(15,23,42,.12)}
.mini-table tr.clickable:hover td{background:var(--accent-l)}
.quick-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qchip{font:500 12px Inter,sans-serif;padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.qchip:hover{border-color:var(--accent);color:var(--accent)}
.qchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.qchip .n{opacity:.75;margin-left:4px}
.empty-state{padding:36px 16px;text-align:center;color:var(--muted)}
.empty-state b{display:block;font-size:15px;color:var(--text);margin-bottom:4px}
.empty-state .btn{margin-top:12px}
.dt tbody tr:hover td{background:#F8FAFD}
.dt tbody tr td:first-child{border-left:3px solid transparent}
.dt tbody tr:hover td:first-child{border-left-color:var(--accent)}
.dt tbody tr[data-first="true"] td{border-top:1px solid var(--border)}
/* progress bar in table */
.prog-bar-wrap{display:flex;align-items:center;gap:7px}
.prog-bar-track{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;min-width:60px}
.prog-bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.prog-bar-fill.done{background:var(--success)}
.prog-bar-fill.warn{background:var(--warn)}
.prog-pct{font-family:Inter,sans-serif;font-size:11px;color:var(--muted);white-space:nowrap}
.action-btns{display:flex;gap:5px;flex-wrap:wrap}
.empty{text-align:center;padding:48px 24px;color:var(--muted);font-size:13px}
.empty svg{width:36px;height:36px;stroke:var(--border);margin:0 auto 12px;display:block}
.export-modal-box{background:var(--surface);border-radius:14px;padding:28px;width:500px;box-shadow:var(--shadow-lg)}
.export-option{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1.5px solid var(--border);border-radius:var(--rs);margin-bottom:10px;cursor:pointer;transition:all .15s}
.export-option:hover,.export-option.selected{border-color:var(--accent);background:var(--accent-l)}
.export-option.ship-opt:hover,.export-option.ship-opt.selected{border-color:var(--purple);background:var(--purple-l)}
.export-icon{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.export-info .export-title{font-size:13px;font-weight:600;margin-bottom:2px}
.export-info .export-desc{font-size:12px;color:var(--muted)}
.relink-modal-box{background:var(--surface);border-radius:14px;padding:28px;width:560px;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto}
.relink-section{margin-bottom:18px}
.relink-section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.relink-line-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:10px}
.relink-line-header{font-size:12px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.relink-current{font-size:11px;color:var(--muted);margin-bottom:10px;font-family:Inter,sans-serif;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--rs);padding:6px 10px}
.relink-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.relink-or{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:11px;color:var(--light)}
.relink-or::before,.relink-or::after{content:'';flex:1;border-top:1px solid var(--border)}
.rl-label{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.rlinput{padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:Inter,sans-serif;font-size:12px;outline:none;width:100%;background:var(--surface);color:var(--text)}
.rlinput:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-l)}
.rlselect{padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:12px;outline:none;width:100%;background:var(--surface);color:var(--text)}
.rlselect:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-l)}
.ship-inv-sel{border-color:var(--success)}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.form-section{padding:22px 24px;border-bottom:1px solid var(--border-soft)}
.form-section:last-child{border-bottom:none}
.sec-title{font-family:Inter,sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{padding:9px 11px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:13px;background:var(--surface);color:var(--text);outline:none;transition:all .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.fg input[readonly]{background:var(--bg);color:var(--muted);cursor:not-allowed}
.computed{background:var(--bg)!important;color:var(--text)!important;font-family:Inter,sans-serif!important;font-size:12px!important;cursor:not-allowed!important}
input[type=date]{padding:8px 11px}
input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6}
input[type=date][readonly]::-webkit-calendar-picker-indicator{display:none}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.no-access{display:flex;align-items:center;justify-content:center;padding:9px;background:var(--bg);border-radius:var(--rs);color:var(--light);font-size:12px;border:1px dashed var(--border);font-style:italic;min-height:38px}
.toggle-wrap{display:flex;align-items:center;gap:10px;min-height:38px}
.toggle{position:relative;width:40px;height:22px;cursor:pointer;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--border);border-radius:22px;transition:.2s}
.toggle-track::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle input:checked~.toggle-track{background:var(--accent)}
.toggle input:checked~.toggle-track::before{transform:translateX(18px)}
.toggle-lbl{font-size:13px;font-weight:500}
.line-items-wrap{padding:22px 24px}
.line-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:18px;margin-bottom:14px;transition:border-color .15s}
.line-item:focus-within{border-color:var(--accent-mid)}
.li-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.li-no{font-family:Inter,sans-serif;font-size:13px;font-weight:600}
.li-sub{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border-soft)}
.li-sub-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--light);margin-bottom:12px}
.add-line{display:flex;align-items:center;gap:6px;padding:10px 16px;border:1.5px dashed var(--border);border-radius:var(--rs);background:transparent;cursor:pointer;color:var(--muted);font-family:inherit;font-size:13px;font-weight:500;width:100%;justify-content:center;margin-top:4px;transition:all .15s}
.add-line:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.form-actions{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.shipment-link-panel{background:var(--purple-l);border:1px solid var(--purple-mid);border-radius:var(--rs);padding:14px 16px;margin-top:12px}
.shipment-link-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--purple);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.shipment-link-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--purple-mid);font-size:12px}
.shipment-link-row:last-child{border-bottom:none}
.sync-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--purple);background:var(--purple-l);border:1px solid var(--purple-mid);border-radius:10px;padding:2px 7px}
.master-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px;max-width:780px;box-shadow:var(--shadow-sm)}
.master-card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface-2)}
.master-card-title{font-family:Inter,sans-serif;font-size:14px;font-weight:600}
.master-form{padding:14px 18px;background:var(--bg);border-bottom:1px solid var(--border)}
.master-list{max-height:320px;overflow-y:auto}
.master-row{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;border-bottom:1px solid var(--border-soft);transition:background .12s}
.master-row:last-child{border-bottom:none}
.master-row:hover{background:var(--bg)}
.master-row-info{display:flex;flex-direction:column;gap:2px}
.master-row-name{font-size:13px;font-weight:600}
.master-row-sub{font-size:11px;color:var(--muted)}
.master-row-actions{display:flex;gap:6px;flex-shrink:0}
.edit-input{padding:6px 10px;border:1.5px solid var(--accent);border-radius:var(--rs);font-family:inherit;font-size:13px;outline:none;background:var(--surface)}
.inline-edit-row{display:flex;gap:6px;align-items:center;width:100%}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border-radius:14px;padding:28px;width:430px;box-shadow:var(--shadow-lg)}
.modal-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.modal-icon svg{width:22px;height:22px;fill:none;stroke-width:2}
.modal-icon.warn{background:var(--warn-l)}.modal-icon.warn svg{stroke:var(--warn)}
.modal-icon.danger{background:var(--danger-l)}.modal-icon.danger svg{stroke:var(--danger)}
.modal h3{font-family:Inter,sans-serif;font-size:17px;font-weight:600;margin-bottom:8px}
.modal p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
/* ── DOCUMENT IMPORT ── */
.import-modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:400;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.import-modal{background:var(--surface);border-radius:16px;width:700px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.import-modal-header{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.import-modal-header h3{font-family:Inter,sans-serif;font-size:17px;font-weight:600}
.import-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;display:flex;align-items:center;transition:color .15s}
.import-close:hover{color:var(--danger)}
.import-body{padding:20px 24px 24px}
.drop-zone{border:2px dashed var(--border);border-radius:var(--r);padding:40px 24px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:var(--accent-l)}
.drop-zone-icon{width:52px;height:52px;background:var(--accent-l);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.drop-zone-icon svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8}
.drop-zone h4{font-family:Inter,sans-serif;font-size:15px;font-weight:600;margin-bottom:6px}
.drop-zone p{color:var(--muted);font-size:13px}
.drop-zone .file-types{display:inline-flex;gap:6px;margin-top:10px}
.drop-zone .ft-tag{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:500;color:var(--muted)}
.import-step{display:none}
.import-step.active{display:block}
.import-processing{text-align:center;padding:40px 0}
.import-spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.import-processing p{color:var(--muted);font-size:13px;margin-top:6px}
.import-processing h4{font-family:Inter,sans-serif;font-size:15px;font-weight:600}
.review-section{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.review-section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px;font-family:Inter,sans-serif}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.review-field{display:flex;flex-direction:column;gap:4px}
.review-label{font-size:11px;font-weight:600;color:var(--light);text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:5px}
.review-input{padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:13px;outline:none;background:var(--surface);width:100%;transition:border-color .15s}
.review-input:focus{border-color:var(--accent)}
.conf-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 6px;border-radius:10px}
.conf-high{background:var(--success-l);color:var(--success)}
.conf-low{background:var(--warn-l);color:var(--warn)}
.conf-none{background:var(--bg);color:var(--light);border:1px solid var(--border)}
.import-error-box{background:var(--danger-l);border:1px solid var(--danger-mid);border-radius:var(--rs);padding:12px 14px;margin-bottom:14px;color:var(--danger);font-size:13px;display:flex;align-items:flex-start;gap:8px}
.import-actions{display:flex;gap:10px;justify-content:flex-end;padding-top:14px;border-top:1px solid var(--border-soft)}
.import-trigger-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--rs);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text);transition:all .15s}
.import-trigger-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.review-lines-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.review-line-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px}
.review-line-item-title{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px;font-family:Inter,sans-serif}
/* ── AUDIT TRAIL ── */
.audit-panel{border-top:1px solid var(--border-soft);margin-top:20px}
.audit-toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;cursor:pointer;user-select:none;transition:background .12s}
.audit-toggle:hover{background:var(--bg)}
.audit-toggle-title{font-family:Inter,sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.audit-body{padding:0 22px 20px;display:none}
.audit-body.open{display:block}
.audit-entry{display:grid;grid-template-columns:140px 160px 120px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12px;align-items:start}
.audit-entry:last-child{border-bottom:none}
.audit-ts{font-family:Inter,sans-serif;font-size:11px;color:var(--light)}
.audit-user{font-weight:500;color:var(--text)}
.audit-action{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.audit-action.created{background:var(--accent-l);color:var(--accent)}
.audit-action.updated{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.audit-action.short-closed{background:var(--warn-l);color:var(--warn)}
.audit-action.cancelled{background:var(--danger-l);color:var(--danger)}
.audit-action.reopened{background:var(--success-l);color:var(--success)}
.audit-changes{color:var(--muted);line-height:1.7}
.audit-change-row{display:flex;gap:6px;align-items:baseline;font-size:11px}
.audit-field{color:var(--text);font-weight:500;min-width:140px}
.audit-from{color:var(--danger);font-family:Inter,sans-serif;font-size:11px}
.audit-to{color:var(--success);font-family:Inter,sans-serif;font-size:11px}
.audit-arrow{color:var(--light);font-size:11px}
/* line status badges */
.b-cancelled{background:var(--danger-l);color:var(--danger)}
.b-short-closed{background:var(--warn-l);color:var(--warn)}
/* ── ORDER FORM WIZARD ── */
.wiz-shell{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
.wiz-main{min-width:0}
.wiz-steps{display:flex;align-items:center;gap:0;margin-bottom:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:0;overflow:hidden;box-shadow:var(--shadow-sm)}
.wiz-step{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 12px;cursor:pointer;border-right:1px solid var(--border);transition:all .15s;font-size:13px;font-weight:500;color:var(--muted);user-select:none;position:relative}
.wiz-step:last-child{border-right:none}
.wiz-step:hover{background:var(--bg)}
.wiz-step.active{background:var(--accent-l);color:var(--accent);font-weight:600}
.wiz-step.done{background:var(--success-l);color:var(--success)}
.wiz-step.done:hover{background:#DCFCE7}
.wiz-step-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;background:var(--border);color:var(--muted)}
.wiz-step.active .wiz-step-num{background:var(--accent);color:#fff}
.wiz-step.done .wiz-step-num{background:var(--success);color:#fff}
.wiz-step-label{font-family:Inter,sans-serif}
.wiz-nav{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-soft)}
/* summary panel */
.wiz-summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);position:sticky;top:76px}
.wiz-summary-title{font-family:Inter,sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.wiz-summary-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:12px;gap:8px}
.wiz-summary-row:last-child{border-bottom:none}
.wiz-summary-label{color:var(--muted);flex-shrink:0}
.wiz-summary-val{font-weight:500;color:var(--text);text-align:right;font-family:Inter,sans-serif;font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiz-summary-divider{height:1px;background:var(--border);margin:10px 0}
.wiz-summary-section{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--light);margin:10px 0 4px}
/* review step */
.review-header-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.review-field-row{display:flex;flex-direction:column;gap:2px}
.review-field-label{font-size:11px;font-weight:600;color:var(--light);text-transform:uppercase;letter-spacing:.4px}
.review-field-val{font-size:13px;color:var(--text);font-weight:500}
.review-line-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:10px}
.review-line-title{font-family:Inter,sans-serif;font-size:12px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px}

/* ── ORDER FORM WIZARD ── */
.wiz-shell{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
.wiz-main{min-width:0}
.wiz-steps{display:flex;align-items:center;margin-bottom:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.wiz-step{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 12px;cursor:pointer;border-right:1px solid var(--border);transition:all .15s;font-size:13px;font-weight:500;color:var(--muted);user-select:none}
.wiz-step:last-child{border-right:none}
.wiz-step:hover{background:var(--bg)}
.wiz-step.active{background:var(--accent-l);color:var(--accent);font-weight:600}
.wiz-step.done{background:var(--success-l);color:var(--success)}
.wiz-step-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;background:var(--border);color:var(--muted)}
.wiz-step.active .wiz-step-num{background:var(--accent);color:#fff}
.wiz-step.done .wiz-step-num{background:var(--success);color:#fff}
.wiz-step-label{font-family:Inter,sans-serif}
.wiz-nav{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-soft)}
.wiz-summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);position:sticky;top:76px}
.wiz-summary-title{font-family:Inter,sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.wiz-summary-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:12px;gap:8px}
.wiz-summary-row:last-child{border-bottom:none}
.wiz-summary-label{color:var(--muted);flex-shrink:0}
.wiz-summary-val{font-weight:500;color:var(--text);text-align:right;font-family:Inter,sans-serif;font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiz-summary-divider{height:1px;background:var(--border);margin:10px 0}
.wiz-summary-section{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--light);margin:10px 0 4px}
.review-header-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.review-field-row{display:flex;flex-direction:column;gap:2px}
.review-field-label{font-size:11px;font-weight:600;color:var(--light);text-transform:uppercase;letter-spacing:.4px}
.review-field-val{font-size:13px;color:var(--text);font-weight:500}
.review-line-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:10px}
.review-line-title{font-family:Inter,sans-serif;font-size:12px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px}

  --bg:#F6F7F9;--surface:#FFFFFF;--surface-2:#FAFBFC;
  --border:#E3E6EB;--border-soft:#EEF0F3;

  --accent:#1F4E8C;--accent-d:#173B6C;--accent-l:#EDF2F9;--accent-mid:#C7D6EC;
  --sb-bg:#0F1C30;--sb-border:#1B2A42;--sb-text:#9AA8BD;--sb-text-active:#F1F4F9;
  --sb-hover:#15243B;--sb-active-bg:rgba(255,255,255,.07);--sb-active-accent:#8FB8EE;--sb-section:#5C6B82;
  --danger:#B4423A;--danger-l:#FBEFEE;--danger-mid:#F1CFCB;
  --success:#2F7D5B;--success-l:#EEF6F1;--success-mid:#C9E3D5;
  --warn:#A9741B;--warn-l:#FBF5E8;--warn-mid:#EBD9AE;
  --purple:#5B4B9E;--purple-l:#F3F1FA;--purple-mid:#D9D3EE;

<body>
<div id="root"></div>
<script>
// ══════════════════════════════════════════════════════════════
// SHAREPOINT CONFIGURATION
// ══════════════════════════════════════════════════════════════
// The SharePoint site URL lives inside the Power Automate flow, not here.

// ══════════════════════════════════════════════════════════════
// SHAREPOINT API LAYER — secure gateway via Power Automate
// ══════════════════════════════════════════════════════════════
// The flow is the only thing that touches SharePoint. It checks the login
// token and the user's role on EVERY call (see docs/SETUP.md).

// ★★★ PUT YOUR POWER AUTOMATE FLOW URL BETWEEN THE QUOTES ON THE NEXT LINE (the ONLY place to edit) ★★★
const FLOW_URL = 'PASTE_YOUR_POWER_AUTOMATE_URL_HERE';

// ── Switches. Both are ON for the upgraded flow + SharePoint columns (docs/FLOW_UPGRADE.md). ──
const FLOW_QUERY  = true;   // ON: the flow understands the "query" setting (FLOW_UPGRADE step 1). Set false only if you use an old copy of the flow.
const USE_COLUMNS = true;   // ON: the SharePoint search columns exist and the flow writes them (FLOW_UPGRADE step 2).
const HARDENED_FLOW = true;  // ON: the lockout and sign-out-on-change steps of docs/FLOW_HARDENING.md are in the flow
const AI_IMPORT   = false;  // PO / shipment document import (needs an API key kept inside the flow)
const APP_VERSION = '1.7.8';
const PAGE_SIZE = 2500, AUDIT_PAGE = 200, HISTORY_MONTHS = 24;

let SP_ENABLED=true;
const SESSION={token:null};
// Keep the sign-in across page refreshes for this browser tab only (cleared when the tab is closed or you sign out)
function saveSession(){try{sessionStorage.setItem('pom_sess',JSON.stringify({token:SESSION.token,user:S.user}));}catch{}}
// ── Background saves: never fail silently ──
const SAVE={pending:0,failed:[]};
const SAVEIND={t:null};
function updateSaveInd(){
  let e=document.getElementById('saveInd');
  if(!e){e=document.createElement('div');e.id='saveInd';e.style.cssText='position:fixed;right:14px;bottom:14px;z-index:99990;padding:6px 12px;border-radius:999px;font:500 12px Inter,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:opacity .3s;opacity:0;pointer-events:none';document.body.appendChild(e);}
  clearTimeout(SAVEIND.t);
  if(SAVE.pending>0){e.textContent='Saving…';e.style.background='#E0ECFF';e.style.color='#1E3A8A';e.style.opacity='1';}
  else if(SAVE.failed.length){e.style.opacity='0';}
  else{e.textContent='Saved ✓';e.style.background='#DCFCE7';e.style.color='#166534';e.style.opacity='1';SAVEIND.t=setTimeout(()=>{e.style.opacity='0';},2500);}
}
const EMPTY_FILTERS=()=>({customers:[],shipmentTypes:[],poStatuses:[],partNos:[],orderDateFrom:'',orderDateTo:'',dockDateFrom:'',dockDateTo:'',shipDateFrom:'',shipDateTo:'',dueWindow:'',inTransitOnly:false});
const EMPTY_SHIP_FILTERS=()=>({customers:[],locations:[],deliveryStatuses:[],partNos:[],poNos:[],kanban:'',shipDateFrom:'',shipDateTo:'',deliveryDateFrom:'',deliveryDateTo:''});
function goOrders(f){S.filters={...EMPTY_FILTERS(),...(f||{})};S.search='';S.page='orders';render();}
function goShipments(f){S.shipFilters={...EMPTY_SHIP_FILTERS(),...(f||{})};S.shipSearch='';S.page='shipments';render();}
function openOrderView(id){const o=S.orders.find(x=>x.id===id);if(!o)return;S.editing=cloneObj(o);S.page='view-order';render();}
function sortArrow(st,key){return st&&st.key===key?(st.dir>0?' ▲':' ▼'):'';}
function sortTh(label,key,which,extra){const st=which==='o'?S.orderSort:S.shipSort;return`<th class="sortable" title="Click to sort" onclick="setSort('${which}','${key}')" ${extra||''}>${label}${sortArrow(st,key)}</th>`;}
function setSort(which,key){const k=which==='o'?'orderSort':'shipSort';const st=S[k]||{};S[k]=st.key===key?(st.dir>0?{key,dir:-1}:{key:'',dir:1}):{key,dir:1};render();}
const cmpVals=(a,b)=>typeof a==='number'&&typeof b==='number'?a-b:String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'});
function sortOrders(list){const st=S.orderSort;if(!st||!st.key)return list;
  const val=o=>st.key==='date'?isoDay(o.orderDate):st.key==='customer'?(o.customerName||''):st.key==='po'?(o.customerPONo||''):st.key==='status'?orderStatus(o):st.key==='open'?o.lines.reduce((t,l)=>t+(+calcLine(l).poOpenQty||0),0):'';
  return [...list].sort((a,b)=>st.dir*cmpVals(val(a),val(b)));}
function sortShips(list){const st=S.shipSort;if(!st||!st.key)return list;
  const val=x=>st.key==='date'?isoDay(x.dateOfShipping):st.key==='invoice'?(x.shippingInvoiceNo||''):st.key==='status'?(x.lines.every(l=>l.deliveryStatus==='Delivered')?'Delivered':'In Transit'):st.key==='qty'?x.lines.reduce((t,l)=>t+(+l.shippedQty||0),0):'';
  return [...list].sort((a,b)=>st.dir*cmpVals(val(a),val(b)));}
function orderHasDue(o,w){return o.lines.some(l=>{if(calcLine(l).poStatus!=='Open')return false;const m=maxIso(l.shipDate1||'',l.revisedShipDate||'');if(!m)return false;const d=daysDiff(m);if(d===null)return false;return w==='overdue'?m<today():w==='today'?m===today():w==='7days'?(d>=0&&d<=7):w==='30days'?(d>=0&&d<=30):false;});}
function setOrderQuick(k){const f=S.filters;f.poStatuses=[];f.dueWindow='';f.inTransitOnly=false;
  if(k==='open')f.poStatuses=['Open'];else if(k==='closed')f.poStatuses=['Closed'];else if(k==='overdue')f.dueWindow='overdue';else if(k==='transit')f.inTransitOnly=true;render();}
function quickChipsHTML(){
  const f=S.filters,os=S.orders;
  const cnt={all:os.length,open:os.filter(o=>orderStatus(o)==='Open').length,overdue:os.filter(o=>orderHasDue(o,'overdue')).length,transit:os.filter(o=>o.lines.some(l=>(+l.inTransit||0)>0)).length,closed:os.filter(o=>orderStatus(o)==='Closed').length};
  const ps=f.poStatuses||[];
  const active=f.inTransitOnly?'transit':f.dueWindow==='overdue'?'overdue':(ps.length===1&&ps[0]==='Open')?'open':(ps.length===1&&ps[0]==='Closed')?'closed':(!ps.length&&!f.dueWindow)?'all':'';
  const L={all:'All',open:'Open',overdue:'Overdue',transit:'In transit',closed:'Closed'};
  return`<div class="quick-chips">${Object.keys(L).map(k=>`<button class="qchip${active===k?' on':''}" data-quick="${k}" onclick="setOrderQuick('${k}')">${L[k]}<span class="n">${cnt[k]}</span></button>`).join('')}</div>`;}
function persist(fn,desc){
  SAVE.pending++;updateSaveInd();
  return Promise.resolve().then(fn).catch(e=>{
    SAVE.failed.push({fn,desc,msg:String((e&&e.message)||e),rec:e&&e.rec,conflict:!!(e&&e.conflict)});
    console.error('SAVE FAILED:',desc,e);
  }).finally(()=>{SAVE.pending--;renderSaveBanner();updateSaveInd();});
}
function renderSaveBanner(){
  let b=document.getElementById('saveBanner');
  if(!SAVE.failed.length){if(b)b.remove();return;}
  if(!b){b=document.createElement('div');b.id='saveBanner';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#B91C1C;color:#fff;padding:10px 16px;font:500 13px Inter,sans-serif;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.3)';document.body.appendChild(b);}
  const f=SAVE.failed,conf=f.some(x=>x.conflict),exp=f.some(x=>/Session expired/.test(x.msg));
  const bt='style="background:#fff;color:#B91C1C;border:none;border-radius:6px;padding:5px 12px;font:600 12px Inter,sans-serif;cursor:pointer"';
  b.innerHTML=`<span><b>${f.length} change${f.length>1?'s':''} NOT saved</b> (${esc(f.map(x=>x.desc).slice(0,3).join(', '))}${f.length>3?'…':''}). ${conf?'Someone else changed the same record.':exp?'Your sign-in expired — sign in again, then press Retry.':'Check the connection, then press Retry.'}</span><button id="sbRetry" ${bt}>Retry</button>${conf?`<button id="sbOver" ${bt}>Overwrite with my version</button><button id="sbReload" ${bt}>Reload latest data</button>`:''}<button id="sbDismiss" ${bt}>Dismiss</button>`;
  const retry=()=>{const items=SAVE.failed.splice(0);renderSaveBanner();items.forEach(x=>persist(x.fn,x.desc));};
  document.getElementById('sbRetry').onclick=retry;
  document.getElementById('sbDismiss').onclick=()=>{SAVE.failed.length=0;renderSaveBanner();};
  const o=document.getElementById('sbOver');if(o)o.onclick=()=>{SAVE.failed.forEach(x=>{if(x.rec)x.rec._forceSave=true;});retry();};
  const r=document.getElementById('sbReload');if(r)r.onclick=()=>{SAVE.failed.length=0;location.reload();};
}
window.addEventListener('beforeunload',e=>{if(SAVE.pending>0||SAVE.failed.length){e.preventDefault();e.returnValue='';}});
function notice(msg,kind){
  let n=document.getElementById('noticeBar');if(n)n.remove();
  n=document.createElement('div');n.id='noticeBar';
  const bg=kind==='warn'?'#FEF3C7;color:#92400E':'#DBEAFE;color:#1E3A8A';
  n.style.cssText=`position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:99998;background:${bg};padding:9px 14px;border-radius:8px;font:500 12px Inter,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.2);max-width:90%;display:flex;gap:10px;align-items:center`;
  n.innerHTML=`<span>${esc(msg)}</span><button style="border:none;background:transparent;cursor:pointer;font-size:14px;color:inherit">✕</button>`;
  n.querySelector('button').onclick=()=>n.remove();document.body.appendChild(n);
  setTimeout(()=>{if(n.isConnected){n.style.transition='opacity .4s';n.style.opacity='0';setTimeout(()=>n.remove(),450);}},kind==='warn'?15000:7000);
}
function clearSession(){try{sessionStorage.removeItem('pom_sess');}catch{}}
function loadSavedSession(){try{const r=JSON.parse(sessionStorage.getItem('pom_sess')||'null');return r&&r.token&&r.user?r:null;}catch{return null;}}

// Send a command to the Power Automate flow
async function flowCall(action, listName, payload={}){
  if(!FLOW_URL||FLOW_URL.startsWith('PASTE_')){
    throw new Error('Power Automate URL not set. Open index.html in Notepad, find the line starting with const FLOW_URL and put your flow address between the quote marks.');
  }
  const res=await fetch(FLOW_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action, listName, token:SESSION.token, ...payload})
  });
  if(res.status===401&&action!=='login'){
    SESSION.token=null;S.user=null;clearSession();S.page='login';S.loginMsg='Your session expired. Please sign in again.';render();
    throw new Error('Session expired');
  }
  if(!res.ok){
    let errMsg='Flow error: '+res.status;
    try{const e=await res.json();errMsg=e.error?.message?.value||e.error?.message||e.error||e.message||errMsg;}catch{}
    throw new Error(typeof errMsg==='string'?errMsg:JSON.stringify(errMsg));
  }
  const text=await res.text();
  if(!text||text.trim()==='')return null;
  const data=JSON.parse(text);
  if(action==='getItems'){
    return data?.value || data?.d?.results || (Array.isArray(data)?data:[]);
  }
  if(action==='createItem'){
    return data?.d || data;
  }
  return data;
}

// Password hashing (done in the browser; the plain password is never sent or stored)
async function hashPw(email,pw){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode('mentco-po:'+String(email).trim().toLowerCase()),iterations:150000,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

  Orders:'POM_Orders',

// ══════════════════════════════════════════════════════════════
// DATA SERIALIZATION — store full objects as JSON in POM_Data
// ══════════════════════════════════════════════════════════════
function spSerialize(obj,title){
  return{Title:String(title||obj.id||obj.name||'item'),POM_Data:JSON.stringify(obj)};
}
function spDeserialize(item){
  // SharePoint may return POM_Data under different names depending on the API used
  const raw=item.POM_Data || item.POM_x005f_Data || item.OData__x0050_OM_Data || item.OData__x0050_OM_x005f_Data || null;
  try{return JSON.parse(raw||'null');}catch{return null;}
}

// ══════════════════════════════════════════════════════════════
// LOAD DATA FROM SHAREPOINT  (all pages; never silently cut off)
// ══════════════════════════════════════════════════════════════
const rowId=r=>r.ID??r.Id;
const dtq=(f,op,d)=>`${f} ${op} datetime'${d}T00:00:00Z'`;
const isoDay=d=>String(d||'').slice(0,10);
const validDay=d=>/^\d{4}-\d{2}-\d{2}/.test(String(d||''));
function cutoffISO(months){const d=new Date();d.setMonth(d.getMonth()-months);return d.toISOString().slice(0,10);}
function addDaysISO(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function mergeRows(a,b){const seen=new Set(a.map(rowId));b.forEach(r=>{if(!seen.has(rowId(r))){seen.add(rowId(r));a.push(r);}});return a;}
const rowToRec=i=>({...spDeserialize(i),_spId:rowId(i),_colStatus:i.Status});
// Read a whole list, page by page (by SharePoint Id). With the old flow (no "query") it reads once and warns if it hit the 5,000 limit.
async function spFetchAll(list,filter){
  const out=[],seen=new Set();let after=0;
  for(let page=0;page<500;page++){
    let rows;
    if(FLOW_QUERY){
      rows=await flowCall('getItems',list,{query:`$top=${PAGE_SIZE}&$orderby=Id&$filter=Id gt ${after}${filter?' and ('+filter+')':''}`});
    } else {
      rows=await flowCall('getItems',list);
      if(rows&&rows.length>=5000)(S.loadWarnings=S.loadWarnings||[]).push(list);
    }
    rows=rows||[];let added=0,maxId=after;
    for(const r of rows){const id=rowId(r);if(id==null||seen.has(id))continue;seen.add(id);out.push(r);added++;if(id>maxId)maxId=id;}
    if(!FLOW_QUERY||added===0||rows.length<PAGE_SIZE)break;
    after=maxId;
  }
  return out;
}
// Newest rows first (used for the audit log)
async function spFetchLatest(list,n,beforeId){
  let rows;
  if(FLOW_QUERY){rows=await flowCall('getItems',list,{query:`$top=${n}&$orderby=Id desc${beforeId?`&$filter=Id lt ${beforeId}`:''}`});}
  else{rows=await flowCall('getItems',list)||[];rows=rows.filter(r=>!beforeId||rowId(r)<beforeId).sort((a,b)=>rowId(b)-rowId(a)).slice(0,n);}
  return rows||[];
}
const fixRates=o=>(o.lines||[]).forEach(l=>{l.usRate=l.usRate||0;l.indiaRate=l.indiaRate||0;});
function applyFinance(finRows){
  (finRows||[]).forEach(i=>{
    const f=spDeserialize(i);if(!f)return;
    const o=S.orders.find(x=>x.id===f.id);if(!o)return;
    o._finSpId=rowId(i);
    (f.rates||[]).forEach((r,idx)=>{if(o.lines[idx]){o.lines[idx].usRate=r.us||0;o.lines[idx].indiaRate=r.in||0;}});
  });
}
async function spLoadAll(){
  // Real data comes from SharePoint — drop the built-in demo records
  S.orders=[];S.shipments=[];S.customers=[];S.parts=[];S.auditLog=[];
  S.nextOrderId=1;S.nextShipId=1;S.nextCustId=1;S.nextPartId=1;S.nextAuditId=1;
  S.loadWarnings=[];S.auditMore=true;S.window={from:null,full:!USE_COLUMNS};
  const cut=cutoffISO(HISTORY_MONTHS),win=USE_COLUMNS;
  const shipCut=addDaysISO(cut,-30);
  // Everything that does not depend on anything else is requested at the same time
  const [openRows,recentRows,custRows,partRows,userRows,auditRows,setRows,shipRows0,finRows0]=await Promise.all([
    spFetchAll(SP_LISTS.Orders,win?"Status eq 'Open'":''),
    win?spFetchAll(SP_LISTS.Orders,dtq('OrderDate','ge',cut)):Promise.resolve([]),
    spFetchAll(SP_LISTS.Customers,''),
    spFetchAll(SP_LISTS.Parts,''),
    isAdmin()?spFetchAll(SP_LISTS.Users,''):Promise.resolve([]),
    spFetchLatest(SP_LISTS.AuditLog,AUDIT_PAGE),
    spFetchAll(SP_LISTS.AppState,''),
    spFetchAll(SP_LISTS.Shipments,win?dtq('ShipDate','ge',shipCut):''),
    canFin()?spFetchAll(SP_LISTS.Finance,win?dtq('OrderDate','ge',cut):''):Promise.resolve([])
  ]);
  const orders=mergeRows(openRows,recentRows).map(rowToRec).filter(o=>o.id!==undefined);
  orders.forEach(fixRates);
  S.orders=orders;if(orders.length)S.nextOrderId=Math.max(...orders.map(o=>o.id||0))+1;
  let shipRows=shipRows0,finRows=finRows0;
  if(win){
    S.window={from:cut,full:false};  // orders are complete from `cut`
    // Old orders that are still open need their shipments / rates too: read further back only if there are any
    const ds=orders.map(o=>isoDay(o.orderDate)).filter(validDay).sort();
    if(ds[0]&&ds[0]<cut){
      const [moreS,moreF]=await Promise.all([
        spFetchAll(SP_LISTS.Shipments,`${dtq('ShipDate','ge',addDaysISO(ds[0],-30))} and ${dtq('ShipDate','lt',shipCut)}`),
        canFin()?spFetchAll(SP_LISTS.Finance,`${dtq('OrderDate','ge',ds[0])} and ${dtq('OrderDate','lt',cut)}`):Promise.resolve([])
      ]);
      shipRows=mergeRows(shipRows.slice(),moreS);finRows=mergeRows(finRows.slice(),moreF);
    }
  }
  const ships=shipRows.map(rowToRec).filter(x=>x.id!==undefined);
  S.shipments=ships;if(ships.length)S.nextShipId=Math.max(...ships.map(x=>x.id||0))+1;
  const custs=custRows.map(rowToRec).filter(x=>x.id!==undefined);
  S.customers=custs;if(custs.length)S.nextCustId=Math.max(...custs.map(c=>c.id||0))+1;
  const parts=partRows.map(rowToRec).filter(x=>x.id!==undefined);
  S.parts=parts;if(parts.length)S.nextPartId=Math.max(...parts.map(p=>p.id||0))+1;
  const users=userRows.map(rowToRec).filter(u=>u.id!==undefined&&u.email);
  if(users.length){USERS=users;S.nextUserId=Math.max(...users.map(u=>u.id||0))+1;}
  const logs=auditRows.map(rowToRec).filter(x=>x.id!==undefined).sort((a,b)=>b.id-a.id);
  S.auditLog=logs;if(logs.length)S.nextAuditId=Math.max(...logs.map(l=>l.id||0))+1;
  S.auditMinSpId=auditRows.length?Math.min(...auditRows.map(rowId)):0;S.auditMore=auditRows.length>=AUDIT_PAGE;
  applyListSettings(setRows);
  applyFinance(finRows);
  syncShipmentsToOrders();
  if(S.loadWarnings.length)notice('Warning: '+[...new Set(S.loadWarnings)].join(', ')+' has 5,000+ rows and the flow cannot read them all yet. Apply the flow upgrade (docs/FLOW_UPGRADE.md) before relying on this data.','warn');
  else if(win)notice(`Showing open orders and the last ${HISTORY_MONTHS} months. Use "Load older history" on the Orders page for earlier data.`);
}
// Load a past date range on request (needs USE_COLUMNS)
async function loadHistory(fromISO,toISO){
  const known=new Set(S.orders.map(o=>o._spId));
  const orderRows=await spFetchAll(SP_LISTS.Orders,`${dtq('OrderDate','ge',fromISO)} and ${dtq('OrderDate','le',toISO)}`);
  const add=orderRows.map(rowToRec).filter(o=>o.id!==undefined&&!known.has(o._spId));add.forEach(fixRates);
  S.orders=S.orders.concat(add);
  const knownS=new Set(S.shipments.map(x=>x._spId));
  const [shipRows,finRows]=await Promise.all([
    spFetchAll(SP_LISTS.Shipments,dtq('ShipDate','ge',addDaysISO(fromISO,-30))),
    canFin()?spFetchAll(SP_LISTS.Finance,`${dtq('OrderDate','ge',fromISO)} and ${dtq('OrderDate','le',toISO)}`):Promise.resolve([])
  ]);
  S.shipments=S.shipments.concat(shipRows.map(rowToRec).filter(x=>x.id!==undefined&&!knownS.has(x._spId)));
  applyFinance(finRows);syncShipmentsToOrders();
  if(S.window&&S.window.from&&fromISO<S.window.from)S.window.from=fromISO;
  return add.length;
}
async function loadMoreAudit(){
  const rows=await spFetchLatest(SP_LISTS.AuditLog,AUDIT_PAGE,S.auditMinSpId);
  const have=new Set(S.auditLog.map(e=>e.id));
  rows.map(rowToRec).filter(x=>x.id!==undefined&&!have.has(x.id)).forEach(e=>S.auditLog.push(e));
  S.auditLog.sort((a,b)=>b.id-a.id);
  if(rows.length)S.auditMinSpId=Math.min(...rows.map(rowId));
  S.auditMore=rows.length>=AUDIT_PAGE;
}
// Dropdown lists (locations, shipment types) are editable by Admin and kept in POM_AppState
function applyListSettings(rows){
  const r=(rows||[]).find(x=>x.Title==='settings');if(!r)return;
  S.settingsSpId=rowId(r);const d=spDeserialize(r)||{};
  if(Array.isArray(d.locations)&&d.locations.length){LOCATIONS.length=0;LOCATIONS.push(...d.locations);}

// Optimistic check: has someone else saved this record since we loaded it? (needs FLOW_QUERY)
async function spCheckConflict(list,rec){
  if(!FLOW_QUERY||!rec._spId||rec._forceSave)return;
  const rows=await flowCall('getItems',list,{query:`$top=1&$filter=Id eq ${rec._spId}`});
  const row=(rows||[]).find(r=>rowId(r)===rec._spId);
  const cur=row?spDeserialize(row):null;
  if(cur&&(cur._rev||0)!==(rec._rev||0)){const e=new Error('CONFLICT');e.conflict=true;e.rec=rec;throw e;}
}
// Sign a user out everywhere (used when an Admin deletes them, changes their role/email or resets their password)
function revokeUserSessions(email){
  if(!SP_ENABLED||!HARDENED_FLOW||!email)return;
  email=String(email).toLowerCase();
  if(S.user&&S.user.email&&S.user.email.toLowerCase()===email)return; // never sign yourself out
  persist(()=>flowCall('revokeSessions',SP_LISTS.Sessions,{email}),'sign out '+email);
}
// One save at a time per record, so quick successive saves never look like a conflict with ourselves
const _saveQ=new Map();
function serialSave(key,fn){const prev=_saveQ.get(key)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);_saveQ.set(key,next);next.catch(()=>{}).then(()=>{if(_saveQ.get(key)===next)_saveQ.delete(key);});return next;}
function knownRev(list,rec){const cur=(list==='o'?S.orders:S.shipments).find(x=>x.id===rec.id);if(cur&&cur!==rec)rec._rev=Math.max(rec._rev||0,cur._rev||0);}
const stripLocal=o=>{const c=cloneObj(o);['_spId','_finSpId','_colStatus','_forceSave'].forEach(k=>delete c[k]);return c;};
function shipStatus(sh){return(sh.lines||[]).length&&sh.lines.every(l=>l.deliveryStatus==='Delivered')?'Delivered':'In Transit';}
function spSaveOrder(order){return serialSave('o'+order.id,()=>spSaveOrderNow(order));}
async function spSaveOrderNow(order){
  if(!SP_ENABLED)return;
  knownRev('o',order);
  await spCheckConflict(SP_LISTS.Orders,order);
  const nextRev=(order._rev||0)+1,status=orderStatus(order);
  const clean=stripLocal(order);clean._rev=nextRev;
  clean.lines=(clean.lines||[]).map(l=>{const c={...l};delete c.usRate;delete c.indiaRate;return c;});
  const fields=spSerialize(clean,order.customerPONo||order.id);
  if(USE_COLUMNS){const c={Customer:String(order.customerName||'').slice(0,250),Status:status};if(validDay(order.orderDate))c.OrderDate=isoDay(order.orderDate)+'T00:00:00Z';fields.Cols=JSON.stringify(c);}
  if(order._spId){
    await flowCall('updateItem',SP_LISTS.Orders,{itemId:order._spId,...fields});
  } else {
    const created=await flowCall('createItem',SP_LISTS.Orders,fields);
    order._spId=(created.ID??created.Id);
    const idx=S.orders.findIndex(o=>o.id===order.id);
    if(idx>=0)S.orders[idx]._spId=(created.ID??created.Id);
  }
  order._rev=nextRev;order._colStatus=status;delete order._forceSave;
  if(canFin())await spSaveFinance(order);
}

async function spSaveFinance(order){
  const fin=spSerialize({id:order.id,rates:(order.lines||[]).map(l=>({us:+l.usRate||0,in:+l.indiaRate||0}))},order.customerPONo||order.id);
  if(USE_COLUMNS&&validDay(order.orderDate))fin.Cols=JSON.stringify({OrderDate:isoDay(order.orderDate)+'T00:00:00Z'});
  if(order._finSpId){
    await flowCall('updateItem',SP_LISTS.Finance,{itemId:order._finSpId,...fin});
  } else {
    const created=await flowCall('createItem',SP_LISTS.Finance,fin);
    order._finSpId=(created.ID??created.Id);
    const idx=S.orders.findIndex(o=>o.id===order.id);
    if(idx>=0)S.orders[idx]._finSpId=(created.ID??created.Id);
  }
}

// Renders a custom multi-select dropdown
function msHTML(id, options, selected, label, color='accent'){
  const sel=Array.isArray(selected)?selected:[];
  const hasVal=sel.length>0;
  const trigLabel=sel.length===0?`All ${label}`:sel.length===options.length?`All ${label}`:sel.length===1?sel[0]:`${sel.length} selected`;
  // Store options in registry — avoids JSON.stringify in onclick attributes
  if(!window._msOpts)window._msOpts={};
  window._msOpts[id]=options;
  return`<div class="ms-wrap" id="msWrap_${id}">
    <div class="ms-trigger${hasVal?' active':''}" onclick="toggleMS('${id}')">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${esc(trigLabel)}</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="ms-dropdown" id="msDrop_${id}" style="display:none" onclick="event.stopPropagation()">
      <div class="ms-item ms-select-all" onclick="msToggleAll('${id}');event.stopPropagation()">
        <input type="checkbox" id="msAll_${id}" ${sel.length===options.length?'checked':''} onclick="event.stopPropagation()">
        <label for="msAll_${id}" style="cursor:pointer">Select All</label>
      </div>
      ${options.map(opt=>`<div class="ms-item" onclick="msToggleItem('${id}','${esc(opt)}');event.stopPropagation()">
        <input type="checkbox" id="msOpt_${id}_${esc(opt)}" ${sel.includes(opt)?'checked':''} onclick="event.stopPropagation()">
        <label for="msOpt_${id}_${esc(opt)}" style="cursor:pointer">${esc(opt)}</label>
      </div>`).join('')}
    </div>
  </div>`;
}
function toggleMS(id){

function syncShipmentsToOrders(){
  // Reset all delivered/inTransit counters
  S.orders.forEach(o=>o.lines.forEach(l=>{l.delivered=0;l.inTransit=0;}));
  S.shipments.forEach(sh=>{
    sh.lines.forEach(sl=>{
      const qty=+sl.shippedQty||0;
      if(!qty)return;
      S.orders.forEach(o=>{
        if(o.customerPONo!==sl.customerPONo)return;
        // CASE 1: orderLineNo is specified — credit exactly that line only
        if(sl.orderLineNo!=null){
          const target=o.lines.find(l=>l.lineNo===sl.orderLineNo&&l.partNo===sl.partNo);
          if(target){
            if(sl.deliveryStatus==='Delivered')target.delivered=(+target.delivered||0)+qty;
            else if(sl.deliveryStatus==='In Transit')target.inTransit=(+target.inTransit||0)+qty;
          }
        } else {
          // CASE 2: no orderLineNo — distribute proportionally (fill lines in order)
          // Find all matching lines for this part
          const matchingLines=o.lines.filter(l=>l.partNo===sl.partNo);
          if(!matchingLines.length)return;
          let remaining=qty;
          for(const l of matchingLines){
            if(remaining<=0)break;
            const capacity=Math.max(0,(+l.poQty||0)-(+l.delivered||0)-(+l.inTransit||0));
            // For delivered lines, fill up to poQty; for in-transit fill remaining capacity
            const allocate=sl.deliveryStatus==='Delivered'
              ? Math.min(remaining, Math.max(0,(+l.poQty||0)-(+l.delivered||0)))
              : Math.min(remaining, capacity);
            if(allocate>0){
              if(sl.deliveryStatus==='Delivered')l.delivered=(+l.delivered||0)+allocate;
              else if(sl.deliveryStatus==='In Transit')l.inTransit=(+l.inTransit||0)+allocate;
              remaining-=allocate;
            }
          }
          // If still remaining (e.g. over-shipped), add to last matching line
          if(remaining>0){
            const last=matchingLines[matchingLines.length-1];
            if(sl.deliveryStatus==='Delivered')last.delivered=(+last.delivered||0)+remaining;
            else if(sl.deliveryStatus==='In Transit')last.inTransit=(+last.inTransit||0)+remaining;
          }
        }
      });
    });
  });
}

function diffObjects(label,before,after,fields){
  const changes=[];
  fields.forEach(({key,name})=>{
    // normalize: treat undefined/null/empty string/0 consistently for numeric fields
    let bv=String(before[key]??'');
    let av=String(after[key]??'');
    // treat '0' and '' as same for shortCloseQty and similar fields that default to 0
    if(bv===''&&av==='0')return;
    if(bv==='0'&&av==='')return;
    if(bv===av)return;
    // skip default lineStatus transitions (Open→Open)
    if(key==='lineStatus'&&bv===av)return;
    changes.push({field:name,from:bv||'—',to:av||'—'});
  });
  return changes;
}

function applyOrderFilters(orders){const f=S.filters,q=S.search.toLowerCase();const todayStr=today();return orders.filter(o=>{
  // due window filter — based on max(shipDate1, revisedShipDate) of open lines
  if(f.dueWindow){
    const hasMatch=o.lines.some(l=>{
      if(calcLine(l).poStatus!=='Open')return false;
      const maxSD=maxIso(l.shipDate1||'',l.revisedShipDate||'');
      if(!maxSD)return false;
      const diff=daysDiff(maxSD);
      if(diff===null)return false;
      if(f.dueWindow==='overdue')return maxSD<todayStr;
      if(f.dueWindow==='today')return maxSD===todayStr;
      if(f.dueWindow==='7days')return diff>=0&&diff<=7;
      if(f.dueWindow==='30days')return diff>=0&&diff<=30;
      return false;
    });

function dashHTML(){
  const df=S.dashFilters||(S.dashFilters={customers:[],partNos:[],periods:[],poStatuses:[],shipTypes:[],locations:[]});
  // migrate from old periods array if present
  if(df.periods!==undefined){df.dateFrom='';df.dateTo='';delete df.periods;}
  if(df.period!==undefined){df.dateFrom='';df.dateTo='';delete df.period;}

  // date range filter — no period options needed
  const custOpts=S.customers.map(c=>c.name);
  const partOpts=[...new Set([...allOrderPartNos(),...allShipPartNos()])].sort();
  const shipTypeOpts=allShipTypes();

  function orderMatches(o){
    if(!msMatch(df.customers||[],o.customerName))return false;
    if((df.partNos||[]).length&&!o.lines.some(l=>msMatch(df.partNos,l.partNo)))return false;
    if((df.poStatuses||[]).length&&!msMatch(df.poStatuses,orderStatus(o)))return false;
    if((df.shipTypes||[]).length&&!o.lines.some(l=>msMatch(df.shipTypes,l.shipmentType)))return false;
    if(df.dateFrom&&o.orderDate&&o.orderDate<df.dateFrom)return false;
    if(df.dateTo&&o.orderDate&&o.orderDate>df.dateTo)return false;
    return true;
  }
  function shipMatches(sh){
    if((df.customers||[]).length&&!sh.lines.some(l=>msMatch(df.customers,l.shippedTo)))return false;
    if((df.locations||[]).length&&!msMatch(df.locations,sh.location))return false;
    if((df.partNos||[]).length&&!sh.lines.some(l=>msMatch(df.partNos,l.partNo)))return false;
    if(df.dateFrom&&sh.dateOfShipping&&sh.dateOfShipping<df.dateFrom)return false;
    if(df.dateTo&&sh.dateOfShipping&&sh.dateOfShipping>df.dateTo)return false;
    return true;
  }
  const filtOrders=S.orders.filter(orderMatches);
  const filtShips=S.shipments.filter(shipMatches);

  function getRates(sl){
    const o=S.orders.find(o=>o.customerPONo===sl.customerPONo);
    if(!o)return{usRate:0,indiaRate:0};
    const l=sl.orderLineNo!=null?o.lines.find(ln=>ln.lineNo===sl.orderLineNo&&ln.partNo===sl.partNo):o.lines.find(ln=>ln.partNo===sl.partNo);
    return{usRate:+l?.usRate||0,indiaRate:+l?.indiaRate||0};
  }

  const poValueUS=filtOrders.reduce((s,o)=>s+o.lines.reduce((s2,l)=>s2+calcLine(l).usExt,0),0);
  const poValueIN=filtOrders.reduce((s,o)=>s+o.lines.reduce((s2,l)=>s2+calcLine(l).indiaExt,0),0);
  const openOrders=filtOrders.filter(o=>orderStatus(o)==='Open');
  const totalOpenQty=openOrders.reduce((s,o)=>s+o.lines.reduce((s2,l)=>{const c=calcLine(l);return s2+(c.poOpenQty>0?c.poOpenQty:0);},0),0);
  const todayStr=today();

  let salesDelUS=0,salesDelIN=0,salesInTUS=0,salesInTIN=0,qtyDel=0,qtyInT=0;
  filtShips.forEach(sh=>sh.lines.forEach(sl=>{
    const qty=+sl.shippedQty||0;
    const{usRate,indiaRate}=getRates(sl);
    if(sl.deliveryStatus==='Delivered'){salesDelUS+=qty*usRate;salesDelIN+=qty*indiaRate;qtyDel+=qty;}
    else if(sl.deliveryStatus==='In Transit'){salesInTUS+=qty*usRate;salesInTIN+=qty*indiaRate;qtyInT+=qty;}
  }));

  const overdueLines=[];
  filtOrders.forEach(o=>{if(orderStatus(o)==='Open')o.lines.forEach(l=>{
    const c=calcLine(l);
    if(c.poStatus!=='Open')return;
    const maxSD=maxIso(l.shipDate1||'',l.revisedShipDate||'');
    if(!maxSD)return; // no committed ship date — not overdue
    if(maxSD<todayStr)overdueLines.push({order:o,line:l,calc:c,daysOver:Math.abs(daysDiff(maxSD)),overdueDate:maxSD});
  });});
  const overdueQty=overdueLines.reduce((s,x)=>s+(+x.calc.poOpenQty||0),0);
  const avgDaysLate=overdueLines.length?Math.round(overdueLines.reduce((s,x)=>s+x.daysOver,0)/overdueLines.length):0;

  let onTimeCount=0,totalDelivered=0;
  filtShips.forEach(sh=>sh.lines.forEach(sl=>{
    if(sl.deliveryStatus!=='Delivered')return;
    totalDelivered++;
    if(!sl.deliveryDate)return;
    const o=S.orders.find(o=>o.customerPONo===sl.customerPONo);
    if(!o)return;

    if(l?.originalDockDate&&sl.deliveryDate<=l.originalDockDate)onTimeCount++;
  }));
  const onTimeRate=totalDelivered>0?Math.round((onTimeCount/totalDelivered)*100):null;

  const upcomingLines=[];
  S.orders.forEach(o=>{if(orderStatus(o)!=='Open')return;o.lines.forEach(l=>{

    const d=daysDiff(maxSD);

  const moMap={};

  filtOrders.forEach(o=>{if(o.orderDate){const k=o.orderDate.slice(0,7);if(moMap[k]!==undefined){o.lines.forEach(l=>{moMap[k].poUS+=calcLine(l).usExt;moMap[k].poIN+=calcLine(l).indiaExt;});}}});
  filtShips.forEach(sh=>{if(sh.dateOfShipping){const k=sh.dateOfShipping.slice(0,7);if(moMap[k]!==undefined){sh.lines.forEach(sl=>{const qty=+sl.shippedQty||0;const{usRate,indiaRate}=getRates(sl);moMap[k].shipUS+=qty*usRate;moMap[k].shipIN+=qty*indiaRate;});}}});

    const bw=Math.floor((w-arr.length*6)/(arr.length*2+arr.length*0.3));
    return`<svg width="100%" viewBox="0 0 ${w} ${h+22}" style="display:block;overflow:visible">
      ${arr.map(([k,v],i)=>{

        return`<g>

      ${(df.shipTypes||[]).map(v=>`<span class="filter-chip">${esc(v)}<button onclick="S.dashFilters.shipTypes=S.dashFilters.shipTypes.filter(x=>x!==\'${esc(v)}\');render()">&#xd7;</button></span>`).join('')}

  </div>`;

  const alertStrip=overdueLines.length>0?`<div class="alert-strip" style="margin-bottom:16px">

  const financeKPIs=canFin()?`<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:12px">

    <div class="stat-card" style="border-top:3px solid var(--success)">
      <div class="stat-label">Sales Delivered US</div>

      <div class="stat-sub">${fmtQ(qtyDel)} pcs</div>
    </div>
    <div class="stat-card" style="border-top:3px solid #6B8F5E">
      <div class="stat-label">Sales Delivered India ($)</div>
      <div class="stat-value" style="font-size:20px;color:#6B8F5E">${fmtI(salesDelIN)}</div>
      <div class="stat-sub">${fmtQ(qtyDel)} pcs</div>

    <div class="stat-card clickable" title="Click to see shipments in transit" onclick="goShipments({deliveryStatuses:['In Transit']})" style="border-top:3px solid var(--warn)">
      <div class="stat-label">In Transit US</div>
      <div class="stat-value" style="font-size:20px;color:var(--warn)">${fmt(salesInTUS)}</div>
      <div class="stat-sub">${fmtQ(qtyInT)} pcs</div>

    <div class="stat-card clickable" title="Click to see shipments in transit" onclick="goShipments({deliveryStatuses:['In Transit']})" style="border-top:3px solid #A9741B">
      <div class="stat-label">In Transit India ($)</div>
      <div class="stat-value" style="font-size:20px;color:#A9741B">${fmtI(salesInTIN)}</div>

      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div>
          <div class="stat-label">Overdue PO Lines</div>

  const perfChart=`<div class="chart-card">

    ${custPerfArr.length===0?`<p style="font-size:13px;color:var(--muted);padding:12px 0">No shipment data available</p>`:
    custPerfArr.slice(0,6).map(([name,v])=>{
