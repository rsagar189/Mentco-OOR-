    <div style="display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft)">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;background:var(--success);border-radius:2px;display:inline-block"></span>Delivered</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;background:var(--warn);border-radius:2px;display:inline-block;opacity:.7"></span>In Transit</span>
    </div>
  </div>`;

  const upcomingTable=`<div class="chart-card">
    <div class="chart-title">Upcoming Must-Ship <span class="chart-subtitle">next 7 days</span>
      ${upcomingLines.length?`<span class="badge clickable ${upcomingLines.some(x=>x.daysLeft<=3)?'b-red':'b-yellow'}" onclick="goOrders({dueWindow:'7days'})">${upcomingLines.length} &rarr;</span>`:`<span class="badge b-green">Clear</span>`}
    </div>
    ${upcomingLines.length===0?`<div style="padding:20px 0;text-align:center">
      <div style="width:36px;height:36px;background:var(--success-l);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div>
      <p style="font-size:13px;color:var(--muted);font-weight:500">No urgent shipments</p>
      <p style="font-size:11px;color:var(--light);margin-top:2px">Nothing due in next 7 days</p>
    </div>`:`
    <table class="mini-table">
      <thead><tr><th>Customer</th><th>PO No</th><th>Part</th><th>Ship Date</th><th style="text-align:center">Left</th><th style="text-align:right">Qty</th></tr></thead>
      <tbody>${upcomingLines.slice(0,8).map(({order:o,line:l,calc:c,daysLeft,shipDate})=>`<tr class="clickable" onclick="openOrderView(${o.id})">
        <td style="font-size:11px;font-weight:500">${esc(o.customerName)}</td>
        <td style="font-family:Inter,sans-serif;font-size:11px">${esc(o.customerPONo)}</td>
        <td style="font-family:Inter,sans-serif;font-size:11px">${esc(l.partNo)}</td>
        <td style="font-size:11px">${fmtDate(shipDate)}</td>
        <td style="text-align:center"><span class="badge ${daysLeft<=3?'b-red':'b-yellow'}" style="font-size:11px">${daysLeft}d</span></td>
        <td style="font-family:Inter,sans-serif;font-size:11px;text-align:right">${c.poOpenQty}</td>
      </tr>`).join('')}</tbody>
    </table>`}
  </div>`;

  const overdueTable=`<div class="chart-card">
    <div class="chart-title">Overdue PO Lines
      ${overdueLines.length?`<span class="badge b-red clickable" onclick="goOrders({dueWindow:'overdue'})">${overdueLines.length} line${overdueLines.length>1?'s':''} &rarr;</span>`:`<span class="badge b-green">All on track &#x2713;</span>`}
    </div>
    ${overdueLines.length===0?`<div style="padding:20px 0;text-align:center">
      <div style="width:36px;height:36px;background:var(--success-l);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div>
      <p style="font-size:13px;color:var(--muted);font-weight:500">No overdue lines</p>
    </div>`:`
    <table class="mini-table">
      <thead><tr><th>Customer</th><th>PO No</th><th>Part</th><th>Ship Date</th><th style="text-align:center">Late</th><th style="text-align:right">Qty</th></tr></thead>
      <tbody>${overdueLines.slice(0,8).map(({order:o,line:l,calc:c,daysOver,overdueDate})=>`<tr class="clickable" onclick="openOrderView(${o.id})">
        <td style="font-size:11px;font-weight:500">${esc(o.customerName)}</td>
        <td style="font-family:Inter,sans-serif;font-size:11px">${esc(o.customerPONo)}</td>
        <td style="font-family:Inter,sans-serif;font-size:11px">${esc(l.partNo)}</td>
        <td style="font-size:11px">${fmtDate(overdueDate)}</td>
        <td style="text-align:center"><span class="badge b-red" style="font-size:11px">+${daysOver}d</span></td>
        <td style="font-family:Inter,sans-serif;font-size:11px;text-align:right">${c.poOpenQty}</td>
      </tr>`).join('')}</tbody>
    </table>
    ${overdueLines.length>8?`<div style="padding:8px 0 0;text-align:center;font-size:11px;color:var(--muted)">${overdueLines.length-8} more &mdash; <span style="color:var(--accent);cursor:pointer" onclick="goOrders({dueWindow:'overdue'})">view all &rarr;</span></div>`:''}`}
  </div>`;

  const recentShips=`<div class="chart-card">
    <div class="chart-title">Recent Shipments <span class="chart-subtitle">${filtShips.length} total</span></div>
    <table class="mini-table">
      <thead><tr><th>Invoice</th><th>Customer</th><th>Loc</th><th>Date</th><th style="text-align:right">Qty</th><th style="text-align:center">Status</th></tr></thead>
      <tbody>${filtShips.length?[...filtShips].reverse().slice(0,8).map(s=>{
        const allDel=s.lines.every(l=>l.deliveryStatus==='Delivered');
        const custs=[...new Set(s.lines.map(l=>l.shippedTo))].join(', ');
        const qty=s.lines.reduce((sm,l)=>sm+(+l.shippedQty||0),0);
        return`<tr>
          <td style="font-family:Inter,sans-serif;font-size:11px;font-weight:500">${esc(s.shippingInvoiceNo)}</td>
          <td style="font-size:11px;font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(custs)}</td>
          <td><span class="badge ${s.location==='India'?'b-blue':'b-purple'}" style="font-size:11px;padding:1px 5px">${esc(s.location||'&#x2014;')}</span></td>
          <td style="font-size:11px;white-space:nowrap">${fmtDate(s.dateOfShipping)}</td>
          <td style="font-family:Inter,sans-serif;font-size:11px;text-align:right">${qty.toLocaleString()}</td>
          <td style="text-align:center"><span class="badge ${allDel?'b-green':'b-yellow'}" style="font-size:11px;padding:1px 5px">${allDel?'Delivered':'In Transit'}</span></td>
        </tr>`;
      }).join(''):`<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--muted);font-size:12px">No shipments</td></tr>`}</tbody>
    </table>
  </div>`;

  const row4=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">${perfChart}${upcomingTable}</div>`;
  const row5=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">${overdueTable}${recentShips}</div>`;

  return filterBar+alertStrip+financeKPIs+opsKPIs+orderChart+shipChart+row4+row5;
}

function ordersHTML(){
  const f=S.filters;
  const custOpts=S.customers.map(c=>c.name);
  const shipTypeOpts=allShipTypes();
  const partOpts=allOrderPartNos();
  const statusOpts=['Open','Closed','Cancelled'];
  const filtered=sortOrders(applyOrderFilters(S.orders));
  const todayStr=today();

  // Quick stats
  const allOpen=S.orders.filter(o=>orderStatus(o)==='Open').length;
  const allClosed=S.orders.filter(o=>orderStatus(o)==='Closed').length;
  const allCancelled=S.orders.filter(o=>orderStatus(o)==='Cancelled').length;
  const overdueOrders=S.orders.filter(o=>orderStatus(o)==='Open'&&o.lines.some(l=>{const c=calcLine(l);if(c.poStatus!=='Open')return false;const maxSD=maxIso(l.shipDate1||'',l.revisedShipDate||'');return maxSD&&maxSD<todayStr;})).length;
  const thisMonth=today().slice(0,7);
  const thisMonthCount=S.orders.filter(o=>o.orderDate?.startsWith(thisMonth)).length;

  // Chips
  const chips=[];
  if(f.customers?.length)chips.push({key:'customers',label:`Customer: ${f.customers.join(', ')}`});
  if(f.shipmentTypes?.length)chips.push({key:'shipmentTypes',label:`Type: ${f.shipmentTypes.join(', ')}`});
  if(f.poStatuses?.length)chips.push({key:'poStatuses',label:`Status: ${f.poStatuses.join(', ')}`});
  if(f.partNos?.length)chips.push({key:'partNos',label:`Part: ${f.partNos.join(', ')}`});
  if(f.orderDateFrom)chips.push({key:'orderDateFrom',label:`Order From: ${fmtDate(f.orderDateFrom)}`});
  if(f.orderDateTo)chips.push({key:'orderDateTo',label:`Order To: ${fmtDate(f.orderDateTo)}`});
  if(f.dockDateFrom)chips.push({key:'dockDateFrom',label:`Dock From: ${fmtDate(f.dockDateFrom)}`});
  if(f.dockDateTo)chips.push({key:'dockDateTo',label:`Dock To: ${fmtDate(f.dockDateTo)}`});
  if(f.shipDateFrom)chips.push({key:'shipDateFrom',label:`Ship From: ${fmtDate(f.shipDateFrom)}`});
  if(f.shipDateTo)chips.push({key:'shipDateTo',label:`Ship To: ${fmtDate(f.shipDateTo)}`});

  // Alert strip for overdue
  const alertStrip=overdueOrders>0?`<div class="alert-strip">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span class="alert-strip-text">${overdueOrders} order${overdueOrders>1?'s':''} with overdue must-ship dates require attention</span>
    <span class="alert-strip-link" onclick="S.filters.dueWindow='overdue';render()">View Overdue Orders →</span>
  </div>`:'';

  return`${alertStrip}
  ${historyPanelHTML()}
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="searchInput" placeholder="Search customer, PO, buyer, part no..." value="${esc(S.search)}"></div>
      <button class="btn btn-secondary btn-sm" id="filterToggleBtn" style="${S.filterOpen?'background:var(--accent-l);color:var(--accent);border-color:var(--accent)':''}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        Filters${chips.length?` <span class="badge b-blue" style="padding:1px 6px">${chips.length}</span>`:''}
      </button>
      ${chips.length?`<button class="btn btn-secondary btn-sm" id="clearAllFilters" style="color:var(--danger)">✕ Clear</button>`:''}
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-success btn-sm" id="orderExportBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Export</button>
      ${canEdit()&&AI_IMPORT?`<button class="btn btn-secondary btn-sm" id="importDocBtn" style="border-color:var(--purple);color:var(--purple)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Import Doc</button>`:''}
      ${canEdit()?`<button class="btn btn-primary btn-sm" id="newOrderBtn">+ New Order</button>`:''}
    </div>
  </div>

  ${chips.length?`<div class="active-filters">${chips.map(c=>`<span class="filter-chip">${esc(c.label)}<button onclick="S.filters['${c.key}']=[];render()">×</button></span>`).join('')}</div>`:''}
  ${quickChipsHTML()}
  <div class="filter-panel${S.filterOpen?' open':''}">
    <div class="fp-title">Advanced Filters — <span style="font-weight:400;color:var(--light)">multi-select supported</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px">
      <div class="fg-f"><label>Customer</label>${msHTML('fCust',custOpts,f.customers||[],'Customers')}</div>
      <div class="fg-f"><label>Shipment Type</label>${msHTML('fShipType',shipTypeOpts,f.shipmentTypes||[],'Types')}</div>
      <div class="fg-f"><label>PO Status</label>${msHTML('fStatus',statusOpts,f.poStatuses||[],'Statuses')}</div>
      <div class="fg-f"><label>Part No</label>${msHTML('fPartNo',partOpts,f.partNos||[],'Parts')}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
      <div class="fg-f"><label>Order Date From</label><input type="date" id="fOrderFrom" value="${f.orderDateFrom||''}"></div>
      <div class="fg-f"><label>Order Date To</label><input type="date" id="fOrderTo" value="${f.orderDateTo||''}"></div>
      <div class="fg-f"><label>Dock Date From</label><input type="date" id="fDockFrom" value="${f.dockDateFrom||''}"></div>
      <div class="fg-f"><label>Dock Date To</label><input type="date" id="fDockTo" value="${f.dockDateTo||''}"></div>
    </div>
    <div class="fp-actions">
      <button class="btn btn-primary btn-sm" id="applyFilters">Apply</button>
      <button class="btn btn-secondary btn-sm" id="resetFilters">Reset All</button>
    </div>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
    <div style="font-size:12px;color:var(--muted)">Showing <strong>${filtered.length}</strong> of <strong>${S.orders.length}</strong> orders</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${['today','7days','30days'].map(w=>{
        const labels={overdue:'⚠ Overdue',today:'Due Today','7days':'Due 7 Days','30days':'Due 30 Days'};
        const colors={overdue:'var(--danger)','today':'var(--warn)','7days':'var(--accent)','30days':'var(--success)'};
        const bgColors={overdue:'var(--danger-l)','today':'var(--warn-l)','7days':'var(--accent-l)','30days':'var(--success-l)'};
        const borderColors={overdue:'var(--danger-mid)','today':'var(--warn-mid)','7days':'#BFDBFE','30days':'var(--success-mid)'};
        const isActive=S.filters.dueWindow===w;
        // count orders matching this window
        const todayStr=today();
        const count=S.orders.filter(o=>o.lines.some(l=>{
          if(calcLine(l).poStatus!=='Open')return false;
          const maxSD=maxIso(l.shipDate1||'',l.revisedShipDate||'');
          if(!maxSD)return false;
          const diff=daysDiff(maxSD);
          if(diff===null)return false;
          if(w==='overdue')return maxSD<todayStr;
          if(w==='today')return maxSD===todayStr;
          if(w==='7days')return diff>=0&&diff<=7;
          if(w==='30days')return diff>=0&&diff<=30;
          return false;
        })).length;
        return`<button onclick="S.filters.dueWindow=S.filters.dueWindow==='${w}'?'':'${w}';render()" style="
          font-size:11px;font-weight:500;padding:4px 11px;border-radius:20px;cursor:pointer;
          border:1.5px solid ${isActive?colors[w]:borderColors[w]};
          background:${isActive?colors[w]:bgColors[w]};
          color:${isActive?'#fff':colors[w]};
          transition:all .15s
        ">${labels[w]} <span style="opacity:.8">${count}</span></button>`;
      }).join('')}
    </div>
  </div>
  <div class="table-wrap tall"><table class="dt">
    <thead><tr>${sortTh('Order Date','date','o')}${sortTh('Customer','customer','o')}${sortTh('Customer PO No','po','o')}<th>Part No</th><th>PO Qty</th><th>Delivered</th><th>In Transit</th>${sortTh('PO Open Qty','open','o')}<th>Progress</th>${sortTh('Status','status','o')}<th>Actions</th></tr></thead>
    <tbody>${filtered.length?filtered.map(o=>{
      const st=orderStatus(o);
      return o.lines.map((l,li)=>{
        const c=calcLine(l);
        // risk dot
        let riskClass='green';
        if(c.mustShipDate&&c.mustShipDate<todayStr&&c.poStatus==='Open')riskClass='red';
        else if(c.mustShipDate){const d=daysDiff(c.mustShipDate);if(d!==null&&d<=7&&c.poStatus==='Open')riskClass='yellow';}
        // progress
        const delivered=+l.delivered||0,poQty=+l.poQty||1;
        const pct=Math.min(100,Math.round((delivered/poQty)*100));
        const progClass=pct>=100?'done':(riskClass==='red'?'warn':'');
        const rowStyle=st==='Cancelled'?'background:rgba(220,38,38,.03);opacity:.85':'';
        return`<tr style="${rowStyle}">
          <td style="font-size:12px;white-space:nowrap">${li===0?(fmtDate(o.orderDate)||'—'):'<span style="color:var(--border-soft)">—</span>'}</td>
          <td style="font-size:12px;font-weight:500">${li===0?`<div style="display:flex;align-items:center;gap:6px"><span class="risk-dot ${riskClass}"></span>${esc(o.customerName||'—')}</div>`:'<span style="color:var(--border-soft)">—</span>'}</td>
          <td style="font-family:Inter,sans-serif;font-size:12px;font-weight:500">${li===0?esc(o.customerPONo||'—'):'<span style="color:var(--light);font-size:11px">↳ same PO</span>'}</td>
          <td style="font-family:Inter,sans-serif;font-size:12px">${esc(l.partNo||'—')}</td>
          <td style="font-family:Inter,sans-serif;font-size:12px;text-align:right">${l.poQty||'—'}</td>
          <td style="font-family:Inter,sans-serif;font-size:12px;text-align:right;color:var(--success)">${l.delivered||0}</td>
          <td style="font-family:Inter,sans-serif;font-size:12px;text-align:right;color:var(--warn)">${l.inTransit||0}</td>
          <td style="font-family:Inter,sans-serif;font-size:12px;text-align:right;font-weight:500;color:${c.poOpenQty>0?'var(--accent)':'var(--muted)'}">${c.poOpenQty}</td>
          <td style="min-width:100px"><div class="prog-bar-wrap"><div class="prog-bar-track"><div class="prog-bar-fill ${progClass}" style="width:${pct}%"></div></div><span class="prog-pct">${pct}%</span></div></td>
          <td>
            ${li===0?`<span class="badge ${st==='Cancelled'?'b-red':st==='Open'?'b-blue':'b-green'}">${st}</span>`:''}
            ${(()=>{const lSt=l.lineStatus||'Open';if(lSt==='Cancelled')return`<span class="badge b-cancelled" style="font-size:11px;margin-top:2px;display:inline-block">Line Cancelled</span>`;if(lSt==='Short Closed')return`<span class="badge b-short-closed" style="font-size:11px;margin-top:2px;display:inline-block">Short Closed</span>`;return'';})()}
          </td>
          <td>${li===0?`<div class="action-btns">
            <button class="btn btn-secondary btn-sm" data-action="view" data-id="${o.id}">View</button>
            ${(isAdmin()||S.user?.role==='Staff')?`<button class="btn btn-secondary btn-sm" data-action="edit" data-id="${o.id}">${S.user?.role==='Staff'?'Update':'Edit'}</button>`:''}
            ${isAdmin()?`<button class="btn btn-secondary btn-sm" style="color:var(--danger)" data-action="deleteOrder" data-id="${o.id}">Delete</button>`:''}
          </div>`:'&nbsp;'}</td>
        </tr>`;
      }).join('');
    }).join(''):`<tr><td colspan="11"><div class="empty-state">${S.orders.length===0?`<b>No orders yet</b>${canEdit()?'Create your first purchase order to get started.<br><button class="btn btn-primary btn-sm" onclick="S.editing={lines:[emptyLine(1)],consignment:false,orderDate:today()};S.orderWizStep=1;S.page=\'new-order\';render()">+ New Order</button>':'Orders will appear here once they are created.'}`:`<b>No orders match your filters</b>Try a different search or clear the filters.<br><button class="btn btn-secondary btn-sm" onclick="S.filters=EMPTY_FILTERS();S.search=\'\';render()">Clear filters</button>`}</div></td></tr>`}</tbody>
  </table></div>`;
}

function bindOrderRelinkModal(){
  const order=S.orders.find(o=>o.id===S.relinkOrderId);if(!order)return;
  const singleLine=S.relinkOrderLineIdx!==null;
  const linesToProcess=singleLine?[{line:order.lines[S.relinkOrderLineIdx],idx:S.relinkOrderLineIdx}]:order.lines.map((line,idx)=>({line,idx}));
  document.getElementById('orderRelinkCancel').onclick=()=>{S.showOrderRelink=false;S.relinkOrderId=null;S.relinkOrderLineIdx=null;render();};
  document.getElementById('orderRelinkSave').onclick=()=>{
    linesToProcess.forEach(({line:l,idx:i})=>{
      // Section 1: Part No change
      const newPart=document.getElementById(`rlOrdPart${i}`)?.value;
      if(newPart&&newPart!==l.partNo){l.partNo=newPart;}
      // Section 2: Shipment invoice re-link
      const selectedInv=document.getElementById(`rlShipInv${i}`)?.value;
      if(selectedInv){
        const targetShipment=S.shipments.find(s=>s.shippingInvoiceNo===selectedInv);
        if(targetShipment){
          // Remove old links for this order line from other shipments
          S.shipments.forEach(sh=>{if(sh.shippingInvoiceNo===selectedInv)return;sh.lines.forEach(sl=>{if(sl.customerPONo===order.customerPONo&&sl.partNo===l.partNo){sl.customerPONo='';sl.partNo='';sl.orderLineNo=null;}});});
          // Find an empty line or add one in target shipment
          const existingLine=targetShipment.lines.find(sl=>!sl.partNo||!sl.customerPONo);
          if(existingLine){existingLine.customerPONo=order.customerPONo;existingLine.partNo=l.partNo;existingLine.orderLineNo=l.lineNo;}
          else{targetShipment.lines.push({...emptyShipLine(targetShipment.lines.length+1),customerPONo:order.customerPONo,partNo:l.partNo,orderLineNo:l.lineNo,shippedTo:order.customerName});}
        }
      }
    });
    syncShipmentsToOrders();
    persist(()=>spSaveOrder(order),'save relink order');
    S.showOrderRelink=false;S.relinkOrderId=null;S.relinkOrderLineIdx=null;
    S.modal={title:'Re-link Saved',type:'warn',confirmLabel:'OK',message:`Order <strong>${esc(order.customerPONo)}</strong> re-linked and all quantities re-synced.`,onConfirm:()=>{S.modal=null;render();}};
    render();
  };
}

function bindShipRelinkModal(){
  const sh=S.shipments.find(s=>s.id===S.relinkShipId);if(!sh)return;
  // PO dropdown → refresh part dropdown and clear line no
  document.querySelectorAll('.rl-po-sel').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const i=parseInt(sel.dataset.li);
      const poNo=sel.value;
      const o=S.orders.find(o=>o.customerPONo===poNo);
      const parts=o?[...new Set(o.lines.map(l=>l.partNo).filter(Boolean))]:[];
      const partSel=document.getElementById(`rlPart${i}`);
      if(partSel){partSel.innerHTML=`<option value="">Select Part…</option>${parts.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}`;}
      const lineSel=document.getElementById(`rlOrderLine${i}`);
      if(lineSel){lineSel.innerHTML='<option value="">— Select after choosing Part No —</option>';}
    });
  });
  // Part dropdown → refresh Order Line No dropdown
  document.querySelectorAll('.rl-part-sel').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const i=parseInt(sel.dataset.li);
      const poSel=document.getElementById(`rlPO${i}`);
      const poNo=poSel?.value||sh.lines[i].customerPONo;
      const partNo=sel.value;
      const o=S.orders.find(o=>o.customerPONo===poNo);
      const matchLines=o?o.lines.filter(l=>l.partNo===partNo):[];
      const lineSel=document.getElementById(`rlOrderLine${i}`);
      if(lineSel){lineSel.innerHTML=`<option value="">— Select Order Line —</option>${matchLines.map(l=>`<option value="${l.lineNo}">Line ${l.lineNo} (PO Qty: ${l.poQty})</option>`).join('')}`;}
    });
  });
  document.getElementById('relinkCancel').onclick=()=>{S.showShipRelink=false;S.relinkShipId=null;render();};
  document.getElementById('relinkSave').onclick=()=>{
    const sh2=S.shipments.find(s=>s.id===S.relinkShipId);if(!sh2)return;
    sh2.lines.forEach((l,i)=>{
      const newPO=document.getElementById(`rlPO${i}`)?.value;
      const newPart=document.getElementById(`rlPart${i}`)?.value;
      const newLineNo=document.getElementById(`rlOrderLine${i}`)?.value;
      if(newPO)l.customerPONo=newPO;
      if(newPart)l.partNo=newPart;
      l.orderLineNo=newLineNo?parseInt(newLineNo):null;
    });
    syncShipmentsToOrders();
    persist(()=>spSaveShipment(sh2),'save relink ship');
    S.showShipRelink=false;S.relinkShipId=null;
    S.modal={title:'Re-link Saved',type:'warn',confirmLabel:'OK',message:`Shipment <strong>${esc(sh2.shippingInvoiceNo)}</strong> re-linked and all order quantities re-synced.`,onConfirm:()=>{S.modal=null;render();}};
    render();
  };
}

        const rowTint=l.deliveryStatus==='Delivered'?'rgba(22,163,74,.03)':l.deliveryStatus==='In Transit'?'rgba(217,119,6,.03)':'';
        return`<tr style="${rowTint?`background:${rowTint}`:''}">
          <td style="font-size:12px;white-space:nowrap">${li===0?(fmtDate(s.dateOfShipping)||'—'):'<span style="color:var(--border-soft)">—</span>'}</td>
          <td style="font-family:Inter,sans-serif;font-size:11px;font-weight:500">${li===0?esc(s.shippingInvoiceNo||'—'):'<span style="color:var(--border-soft)">—</span>'}</td>
          <td style="font-family:Inter,sans-serif;font-size:12px;font-weight:500">${esc(l.customerPONo||'—')}</td>
          <td style="font-family:Inter,sans-serif;font-size:12px">${esc(l.partNo||'—')}</td>
          <td style="font-family:Inter,sans-serif;font-size:12px;text-align:right">${l.shippedQty||'—'}</td>
          <td style="font-size:12px">${li===0?esc(s.logistics||'—'):'<span style="color:var(--border-soft)">—</span>'}</td>
          <td style="font-family:Inter,sans-serif;font-size:11px;color:var(--muted)">${li===0?esc(s.trackingNo||'—'):'<span style="color:var(--border-soft)">—</span>'}</td>
          <td><span class="badge ${delBadge}">${esc(l.deliveryStatus||'—')}</span></td>
          <td style="font-size:12px">${fmtDate(l.deliveryDate)||'—'}</td>
          <td>${li===0?`<div class="action-btns">
            <button class="btn btn-secondary btn-sm" data-action="viewShipment" data-id="${s.id}">View</button>
            ${(isAdmin()||S.user?.role==='Staff')?`<button class="btn btn-secondary btn-sm" data-action="editShipment" data-id="${s.id}">${S.user?.role==='Staff'?'Update':'Edit'}</button>`:''}
            ${isAdmin()?`<button class="btn btn-purple btn-sm" data-action="relinkShipment" data-id="${s.id}">Re-link</button>`:''}
            ${isAdmin()?`<button class="btn btn-secondary btn-sm" style="color:var(--danger)" data-action="deleteShipment" data-id="${s.id}">Delete</button>`:''}
          </div>`:'&nbsp;'}</td>
        </tr>`;
      }).join('');
    }).join(''):`<tr><td colspan="10"><div class="empty-state">${S.shipments.length===0?`<b>No shipments yet</b>${canEdit()?'Record your first shipment to track what is on the way.<br><button class="btn btn-primary btn-sm" onclick="S.editingShipment={lines:[emptyShipLine(1)],kanban:false,location:\'India\',dateOfInvoice:today(),dateOfShipping:today()};S.shipWizStep=1;S.page=\'new-shipment\';render()">+ New Shipment</button>':'Shipments will appear here once they are created.'}`:`<b>No shipments match your filters</b>Try a different search or clear the filters.<br><button class="btn btn-secondary btn-sm" onclick="S.shipFilters=EMPTY_SHIP_FILTERS();S.shipSearch=\'\';render()">Clear filters</button>`}</div></td></tr>`}</tbody>
  </table></div>`;
}

function orderFormHTML(){
  const isView=S.page==='view-order';
  const staffOrderPartial=S.page==='edit-order'&&S.user?.role==='Staff';
  const ro=isView||(S.page==='edit-order'&&!isAdmin()&&!staffOrderPartial);
  const STAFF_ORDER_FIELDS=['shipmentType','inTransitDays','shipDate1','revisedShipDate','usSalesOrder','usQBPO','indiaRate','usRate','lineStatus','shortCloseQty'];
  const roLine=(f)=>ro||(staffOrderPartial&&!STAFF_ORDER_FIELDS.some(k=>f===k||f.endsWith('.'+k)));
  const o=S.editing||{lines:[emptyLine(1)],consignment:false,orderDate:today()};
  const linkedShipments=S.shipments.filter(sh=>sh.lines.some(sl=>sl.customerPONo===o.customerPONo));

  // ── WIZARD STEP STATE ──
  // View mode has no wizard — flat read-only layout
  const useWizard=!isView;
  const step=useWizard?(S.orderWizStep||1):null;
  const STEPS=['Order Header','Line Items','Review & Save'];

  // ── FIELD HELPERS (unchanged) ──
  function fld(l,v,f,opts={}){
    const isRo=opts.computed||opts.ro?true:(f&&f.startsWith('lines.')?roLine(f):(ro||staffOrderPartial));
    const cls=opts.computed?'computed':'';
    return`<div class="fg"><label>${l}</label><input class="${cls}" value="${esc(v??'')}" ${isRo?'readonly':''} ${f?`data-f="${esc(f)}"`:''} ></div>`;
  }
  function dateFld(l,v,f,opts={}){
    const isRo=opts.computed||opts.ro?true:(f&&f.startsWith('lines.')?roLine(f):(ro||staffOrderPartial));
    if(isRo)return`<div class="fg"><label>${l}</label><input readonly value="${esc(fmtDate(v))}" class="${opts.computed?'computed':''}"></div>`;
    return`<div class="fg"><label>${l}</label><input type="date" value="${esc(v||'')}" data-f="${esc(f)}"></div>`;
  }
  function selFld(l,v,opts,f){
    const isRo=f&&f.startsWith('lines.')?roLine(f):(ro||staffOrderPartial);
    if(isRo)return fld(l,v,null,{ro:true});
    return`<div class="fg"><label>${l}</label><select data-f="${esc(f)}">${opts.map(op=>`<option${op===v?' selected':''}>${esc(op)}</option>`).join('')}</select></div>`;
  }
  function numFld(l,v,f,opts={}){return fld(l,v??0,f,opts);}
  function taFld(l,v,f){return`<div class="fg" style="grid-column:1/-1"><label>${l}</label><textarea ${ro?'readonly':''} ${f?`data-f="${esc(f)}"`:''} rows="2" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:13px;resize:vertical;outline:none">${esc(v||'')}</textarea></div>`;}

  // ── LINE ITEMS HTML (all lines) ──
  const linesHTML=(o.lines||[]).map((l,i)=>{
    // Always use fresh delivered/inTransit from S.orders (not stale S.editing clone)
    const liveOrder=S.orders.find(ord=>ord.id===o.id);
    const liveLine=liveOrder?.lines?.find(ll=>ll.lineNo===l.lineNo);
    const lForCalc=liveLine?{...l,delivered:liveLine.delivered||0,inTransit:liveLine.inTransit||0}:l;
    const c=calcLine(lForCalc);
    const custParts=partsForCust(o.customerName);
    const lineShips=linkedShipments.flatMap(sh=>sh.lines.filter(sl=>sl.partNo===l.partNo&&sl.customerPONo===o.customerPONo&&(sl.orderLineNo==null||sl.orderLineNo===l.lineNo)).map(sl=>({...sl,invoiceNo:sh.shippingInvoiceNo,dateOfShipping:sh.dateOfShipping})));
    const lineSt=l.lineStatus||'Open';
    const isLineCancelled=lineSt==='Cancelled';
    const isLineShortClosed=lineSt==='Short Closed';
    return`<div class="line-item" data-li="${i}" style="${isLineCancelled?'opacity:.7;background:var(--danger-l);border-color:var(--danger-mid)':isLineShortClosed?'background:var(--warn-l);border-color:var(--warn-mid)':''}">
      <div class="li-header">
        <span class="li-no" style="display:flex;align-items:center;gap:8px">Line Item ${i+1}
          ${isLineCancelled?'<span class="badge b-cancelled">Cancelled</span>':isLineShortClosed?'<span class="badge b-short-closed">Short Closed</span>':''}
        </span>
        <div style="display:flex;gap:6px;align-items:center">
          ${isAdmin()&&isView?`<button class="btn btn-warn btn-sm" data-action="relinkOrderLine" data-id="${o.id}" data-li="${i}">Re-link Line</button>`:''}
          ${canEdit()&&!ro&&!isLineCancelled?`<button class="btn btn-warn btn-sm" data-action="cancelLine" data-li="${i}">Cancel Line</button>`:''}
          ${isAdmin()&&!ro&&isLineCancelled?`<button class="btn btn-success btn-sm" data-action="reopenLine" data-li="${i}">Reopen Line</button>`:''}
          ${!ro&&!staffOrderPartial&&(o.lines.length>1)&&!isLineCancelled?`<button class="btn btn-danger btn-sm" data-action="removeLine" data-li="${i}">Remove</button>`:''}
        </div>
      </div>
      <div class="grid3">
        ${fld('Line No',l.lineNo,`lines.${i}.lineNo`)}
        ${(ro||staffOrderPartial)?fld('Part No',l.partNo,`lines.${i}.partNo`,{ro:true}):custParts.length>0?`<div class="fg"><label>Part No</label><select data-f="lines.${i}.partNo">${custParts.map(p=>`<option value="${esc(p.partNo)}"${p.partNo===l.partNo?' selected':''}>${esc(p.partNo)} - ${esc(p.desc)}</option>`).join('')}</select></div>`:`<div class="fg"><label>Part No</label><input value="${esc(l.partNo)}" data-f="lines.${i}.partNo" placeholder="Select customer first"></div>`}
        ${numFld('PO Qty',l.poQty,`lines.${i}.poQty`)}
        <div class="fg"><label>Delivered <span class="sync-tag">AUTO</span></label><input readonly class="computed" value="${esc(l.delivered??0)}"></div>
        ${fld('Open Qty (auto)',c.openQty,'',{computed:true,ro:true})}
        <div class="fg"><label>In Transit <span class="sync-tag">AUTO</span></label><input readonly class="computed" value="${esc(l.inTransit??0)}"></div>
        ${fld('PO Open Qty (auto)',c.poOpenQty,'',{computed:true,ro:true})}
        ${fld('PO Status (auto)',c.poStatus,'',{computed:true,ro:true})}
        ${(()=>{
          if(isLineCancelled)return'';
          if(ro){
            // view mode — show readonly if value is set
            if(!(+l.shortCloseQty>0))return'';
            return`<div class="fg"><label>Short Close Qty</label><input readonly class="computed" value="${esc(String(l.shortCloseQty||0))}" style="border-color:var(--warn)"></div>`;
          }
          const maxSC=Math.max(0,(+l.poQty||0)-(+l.delivered||0));
          return`<div class="fg"><label style="display:flex;align-items:center;gap:6px">Short Close Qty <span style="font-size:11px;background:var(--warn-l);color:var(--warn);padding:1px 5px;border-radius:4px;font-weight:600">max ${maxSC}</span></label>
            <input type="number" min="0" max="${maxSC}" value="${esc(String(l.shortCloseQty||0))}" data-f="lines.${i}.shortCloseQty" style="border-color:${(+l.shortCloseQty>0)?'var(--warn)':'var(--border)'}">
            ${+l.shortCloseQty>0?(()=>{const scq=+l.shortCloseQty||0;const pq=+l.poQty||0;const del=+l.delivered||0;const effQ=Math.max(0,pq-scq);const openAfter=Math.max(0,effQ-del);return`<div style="font-size:11px;color:var(--warn);margin-top:3px">On save: Effective Qty = ${effQ} · Open Qty → ${openAfter} pcs</div>`;})():''}
          </div>`;
        })()}
      </div>
      <div class="li-sub"><div class="li-sub-title">Shipment</div>
        <div class="grid3">
          ${selFld('Shipment Type',l.shipmentType,SHIP_TYPES,`lines.${i}.shipmentType`)}
          ${numFld('In Transit Days',l.inTransitDays,`lines.${i}.inTransitDays`)}
        </div>
      </div>
      <div class="li-sub"><div class="li-sub-title">Dates</div>
        <div class="grid3">
          ${dateFld('On Dock Date (Original)',l.originalDockDate,`lines.${i}.originalDockDate`)}
          ${fld('Must Ship Date (auto)',fmtDate(c.mustShipDate),'',{computed:true,ro:true})}
          ${dateFld('Ship Date 1',l.shipDate1,`lines.${i}.shipDate1`)}
          ${dateFld('Revised Ship Date 2',l.revisedShipDate,`lines.${i}.revisedShipDate`)}
          ${fld('On Dock Date Revised (auto)',fmtDate(c.revisedDockDate),'',{computed:true,ro:true})}
        </div>
      </div>
      <div class="li-sub"><div class="li-sub-title">Order References</div>
        <div class="grid3">
          ${fld('US Sales Order #',l.usSalesOrder,`lines.${i}.usSalesOrder`)}
          ${fld('US QB PO #',l.usQBPO,`lines.${i}.usQBPO`)}
        </div>
        <div class="grid3" style="margin-top:10px">${taFld('Additional Notes',l.additionalNotes,`lines.${i}.additionalNotes`)}</div>
      </div>
      <div class="li-sub"><div class="li-sub-title">Financials (USD)</div>
        <div class="grid3">
          ${canFin()?numFld('India Rate',l.indiaRate,`lines.${i}.indiaRate`):`<div class="fg"><label>India Rate</label><div class="no-access">No Access</div></div>`}
          ${canFin()?numFld('US Rate',l.usRate,`lines.${i}.usRate`):`<div class="fg"><label>US Rate</label><div class="no-access">No Access</div></div>`}
          ${canFin()?fld('India Ext Sales (auto)',c.indiaExt.toFixed(2),'',{computed:true,ro:true}):`<div class="fg"><label>India Ext Sales</label><div class="no-access">No Access</div></div>`}
          ${canFin()?fld('US Ext Sales (auto)',c.usExt.toFixed(2),'',{computed:true,ro:true}):`<div class="fg"><label>US Ext Sales</label><div class="no-access">No Access</div></div>`}
        </div>
      </div>
      ${lineShips.length?`<div class="shipment-link-panel"><div class="shipment-link-title">Linked Shipments</div>${lineShips.map(sl=>`<div class="shipment-link-row"><span style="font-family:Inter,sans-serif">${esc(sl.invoiceNo)}</span><span>${fmtDate(sl.dateOfShipping)}</span><span>Qty: <strong>${sl.shippedQty}</strong></span>${sl.orderLineNo!=null?`<span class="badge b-purple">Line ${sl.orderLineNo}</span>`:''}<span><span class="badge ${sl.deliveryStatus==='Delivered'?'b-green':'b-yellow'}">${sl.deliveryStatus}</span></span></div>`).join('')}</div>`:''}
    </div>`;
  }).join('');

  // ── SUMMARY PANEL (always visible in wizard) ──
  const fmt=n=>n>=1000000?`$${(n/1000000).toFixed(2)}M`:n>=1000?`$${(n/1000).toFixed(1)}K`:`$${Math.round(n)}`;
  const fmtI=n=>n>=1000000?`$${(n/1000000).toFixed(2)}M`:n>=1000?`$${(n/1000).toFixed(1)}K`:`$${Math.round(n)}`;
  const totalPOQty=(o.lines||[]).reduce((s,l)=>s+(+l.poQty||0),0);
  const totalOpenQty=(o.lines||[]).reduce((s,l)=>s+Math.max(0,calcLine(l).openQty),0);
  const totalUSVal=(o.lines||[]).reduce((s,l)=>s+calcLine(l).usExt,0);
  const totalINVal=(o.lines||[]).reduce((s,l)=>s+calcLine(l).indiaExt,0);
  const lineCount=(o.lines||[]).length;
  const openLineCount=(o.lines||[]).filter(l=>calcLine(l).poStatus==='Open').length;
  const cancelledCount=(o.lines||[]).filter(l=>l.lineStatus==='Cancelled').length;
  const shortClosedCount=(o.lines||[]).filter(l=>l.lineStatus==='Short Closed').length;
  const summaryPanel=useWizard?`<div class="wiz-summary">
    <div class="wiz-summary-title">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      Order Summary
    </div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Customer</span><span class="wiz-summary-val">${esc(o.customerName||'—')}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">PO No</span><span class="wiz-summary-val">${esc(o.customerPONo||'—')}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Order Date</span><span class="wiz-summary-val">${fmtDate(o.orderDate)||'—'}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Buyer</span><span class="wiz-summary-val">${esc(o.buyerName||'—')}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Consignment</span><span class="wiz-summary-val">${o.consignment?'Yes':'No'}</span></div>
    <div class="wiz-summary-divider"></div>
    <div class="wiz-summary-section">Lines</div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Total Lines</span><span class="wiz-summary-val">${lineCount}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Open</span><span class="wiz-summary-val">${openLineCount}</span></div>
    ${cancelledCount?`<div class="wiz-summary-row"><span class="wiz-summary-label">Cancelled</span><span class="wiz-summary-val" style="color:var(--danger)">${cancelledCount}</span></div>`:''}
    ${shortClosedCount?`<div class="wiz-summary-row"><span class="wiz-summary-label">Short Closed</span><span class="wiz-summary-val" style="color:var(--warn)">${shortClosedCount}</span></div>`:''}
    <div class="wiz-summary-row"><span class="wiz-summary-label">Total PO Qty</span><span class="wiz-summary-val">${totalPOQty.toLocaleString()} pcs</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Open Qty</span><span class="wiz-summary-val">${totalOpenQty.toLocaleString()} pcs</span></div>
    ${canFin()?`<div class="wiz-summary-divider"></div>
    <div class="wiz-summary-section">Financials</div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">US Value</span><span class="wiz-summary-val" style="color:var(--accent)">${fmt(totalUSVal)}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">India Value ($)</span><span class="wiz-summary-val" style="color:#3E8E8A">${fmt(totalINVal)}</span></div>`:''}
  </div>`:'';

  // ── STEP INDICATOR ──
  const stepIndicator=useWizard?`<div class="wiz-steps">
    ${STEPS.map((label,idx)=>{
      const sNum=idx+1;
      const isDone=step>sNum;
      const isActive=step===sNum;
      return`<div class="wiz-step${isActive?' active':isDone?' done':''}" onclick="S.orderWizStep=${sNum};S.editing=collectOrderForm();render()">
        <div class="wiz-step-num">${isDone?'✓':sNum}</div>
        <span class="wiz-step-label">${label}</span>
      </div>`;
    }).join('')}
  </div>`:'';

  // ── STEP 1: ORDER HEADER ──
  const headerSection=`<div class="form-card">
    <div class="form-section">
      <div class="sec-title">Order Header</div>
      <div class="grid3">
        ${(()=>{
          if(isView||staffOrderPartial)return fld('Customer Name',o.customerName,'customerName',{ro:true});
          if(!ro)return`<div class="fg"><label>Customer Name</label><select data-f="customerName" id="custNameSel">${S.customers.map(c=>`<option${c.name===o.customerName?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`;
          return fld('Customer Name',o.customerName,'customerName',{ro:true});
        })()}
        ${dateFld('Order Date',o.orderDate,'orderDate')}
        ${fld('Customer PO No',o.customerPONo,'customerPONo')}
        ${fld('Blanket Order No',o.blanketOrderNo,'blanketOrderNo')}
        <div class="fg"><label>Consignment Order</label>
          <div class="toggle-wrap">
            <label class="toggle"><input type="checkbox" id="consignToggle" data-f="consignment" ${o.consignment?'checked':''} ${ro?'disabled':''}><span class="toggle-track"></span></label>
            <span class="toggle-lbl" id="togLbl">${o.consignment?'Yes':'No'}</span>
          </div>
        </div>
        ${fld("Buyer's Name",o.buyerName,'buyerName')}
      </div>
    </div>
  </div>`;

  // ── STEP 2: LINE ITEMS ──
  const lineItemsSection=`<div class="form-card">
    <div class="line-items-wrap">
      <div class="sec-title" style="margin-bottom:14px">Line Items</div>
      <div id="linesContainer">${linesHTML}</div>
      ${!ro&&!staffOrderPartial?`<button class="add-line" id="addLineBtn">+ Add Line Item</button>`:''}
    </div>
  </div>`;

  // ── STEP 3: REVIEW & SAVE ──
  const reviewSection=(()=>{
    const rFld=(label,val)=>`<div class="review-field-row"><div class="review-field-label">${label}</div><div class="review-field-val">${esc(String(val||'—'))}</div></div>`;
    return`<div class="form-card">
      <div class="form-section">
        <div class="sec-title">Order Header — Review</div>
        <div class="review-header-grid">
          ${rFld('Customer',o.customerName)}
          ${rFld('Order Date',fmtDate(o.orderDate))}
          ${rFld('Customer PO No',o.customerPONo)}
          ${rFld('Blanket Order No',o.blanketOrderNo||'—')}
          ${rFld('Consignment',o.consignment?'Yes':'No')}
          ${rFld("Buyer's Name",o.buyerName)}
        </div>
      </div>
      <div class="form-section">
        <div class="sec-title">Line Items — Review</div>
        ${(o.lines||[]).map((l,i)=>{
          const c=calcLine(l);
          const lineSt=l.lineStatus||'Open';
          return`<div class="review-line-card">
            <div class="review-line-title">
              Line Item ${i+1}
              <span class="badge ${lineSt==='Cancelled'?'b-cancelled':lineSt==='Short Closed'?'b-short-closed':c.poStatus==='Open'?'b-blue':'b-green'}">${lineSt==='Cancelled'?'Cancelled':lineSt==='Short Closed'?'Short Closed':c.poStatus}</span>
              <span style="font-family:Inter,sans-serif;font-size:11px;color:var(--muted)">${esc(l.partNo||'—')}</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
              <div class="review-field-row"><div class="review-field-label">PO Qty</div><div class="review-field-val">${l.poQty||0}</div></div>
              <div class="review-field-row"><div class="review-field-label">Open Qty</div><div class="review-field-val">${c.openQty}</div></div>
              <div class="review-field-row"><div class="review-field-label">In Transit</div><div class="review-field-val">${l.inTransit||0}</div></div>
              <div class="review-field-row"><div class="review-field-label">Delivered</div><div class="review-field-val">${l.delivered||0}</div></div>
              <div class="review-field-row"><div class="review-field-label">Shipment Type</div><div class="review-field-val">${esc(l.shipmentType||'—')}</div></div>
              <div class="review-field-row"><div class="review-field-label">Dock Date</div><div class="review-field-val">${fmtDate(l.originalDockDate)||'—'}</div></div>
              <div class="review-field-row"><div class="review-field-label">Ship Date 1</div><div class="review-field-val">${fmtDate(l.shipDate1)||'—'}</div></div>
              <div class="review-field-row"><div class="review-field-label">Revised Ship Date</div><div class="review-field-val">${fmtDate(l.revisedShipDate)||'—'}</div></div>
              ${canFin()?`<div class="review-field-row"><div class="review-field-label">India Rate</div><div class="review-field-val">$${l.indiaRate||0}</div></div>`:''}
              ${canFin()?`<div class="review-field-row"><div class="review-field-label">US Rate</div><div class="review-field-val">$${l.usRate||0}</div></div>`:''}
              ${canFin()?`<div class="review-field-row"><div class="review-field-label">India Ext</div><div class="review-field-val" style="color:#3E8E8A">${fmtI(c.indiaExt)}</div></div>`:''}
              ${canFin()?`<div class="review-field-row"><div class="review-field-label">US Ext</div><div class="review-field-val" style="color:var(--accent)">${fmt(c.usExt)}</div></div>`:''}
              ${+l.shortCloseQty>0?`<div class="review-field-row"><div class="review-field-label">Short Close Qty</div><div class="review-field-val" style="color:var(--warn)">${l.shortCloseQty}</div></div>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  })();

  // ── WIZARD NAV BUTTONS ──
  const wizNav=useWizard?`<div class="wiz-nav">
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary btn-sm" id="backBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        ${step===1?'Cancel':'Back'}
      </button>
      ${step>1?`<button class="btn btn-secondary btn-sm" id="wizPrevBtn">← Previous Step</button>`:''}
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span style="font-size:12px;color:var(--muted)">Step ${step} of ${STEPS.length}</span>
      ${step<STEPS.length?`<button class="btn btn-primary btn-sm" id="wizNextBtn">Next Step →</button>`:''}
      ${step===STEPS.length&&(!ro||staffOrderPartial)?`<button class="btn btn-primary btn-sm" id="saveOrderBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save Order${staffOrderPartial?' (Update)':''}
      </button>`:''}
    </div>
  </div>`:'';

  // ── VIEW MODE ACTION BUTTONS ──
  const viewActions=isView?`<div class="form-actions">
    <button class="btn btn-secondary btn-sm" id="backBtn">Back</button>
    ${canEdit()&&isView&&o.customerPONo?`<button class="btn btn-primary btn-sm" id="newShipFromOrderBtn">+ New Shipment for this PO</button>`:''}
    ${isAdmin()&&isView?`<button class="btn btn-warn btn-sm" id="relinkAllOrderLinesBtn" data-id="${o.id}">Re-link All Lines</button>`:''}
    ${isAdmin()&&isView&&orderStatus(o)!=='Cancelled'?`<button class="btn btn-danger btn-sm" id="cancelOrderBtn" data-id="${o.id}">Cancel PO</button>`:''}
    ${isAdmin()&&isView&&orderStatus(o)==='Cancelled'?`<span class="badge b-red" style="font-size:12px;padding:5px 12px">CANCELLED</span><button class="btn btn-secondary btn-sm" id="reopenOrderBtn" data-id="${o.id}">Reopen PO</button>`:''}
  </div>`:'';

  // ── BANNERS ──
  const banners=`
    ${orderStatus(o)==='Cancelled'?`<div style="background:var(--danger-l);border:1px solid var(--danger-mid);border-radius:var(--rs);padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--danger)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span><strong>This PO is Cancelled.</strong> Use Reopen PO to restore it.</span></div>`:''}
    ${isAdmin()&&isView?`<div style="background:var(--warn-l);border:1px solid #fde68a;border-radius:var(--rs);padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--warn)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><span><strong>Admin Re-link:</strong> Use Re-link All Lines to change Customer PO No, Part No, or Shipment links.</span></div>`:''}
    ${staffOrderPartial?`<div style="background:var(--accent-l);border:1px solid #bfdbfe;border-radius:var(--rs);padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--accent);display:flex;align-items:center;gap:8px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><span><strong>Staff Update Mode:</strong> Editable per line: Shipment Type, In Transit Days, Ship Date 1, Revised Ship Date 2, US Sales Order #, US QB PO #, India Rate, US Rate, Short Close Qty.</span></div>`:''}`;

  // ── ASSEMBLE ──
  if(isView){
    // Flat view — no wizard, show everything
    return`${viewActions}${banners}
      <div class="form-card">
        <div class="form-section"><div class="sec-title">Order Header</div><div class="grid3">
          ${fld('Customer Name',o.customerName,'customerName',{ro:true})}
          ${dateFld('Order Date',o.orderDate,'orderDate')}
          ${fld('Customer PO No',o.customerPONo,'customerPONo')}
          ${fld('Blanket Order No',o.blanketOrderNo,'blanketOrderNo')}
          <div class="fg"><label>Consignment Order</label><div class="toggle-wrap"><label class="toggle"><input type="checkbox" id="consignToggle" data-f="consignment" ${o.consignment?'checked':''} disabled><span class="toggle-track"></span></label><span class="toggle-lbl">${o.consignment?'Yes':'No'}</span></div></div>
          ${fld("Buyer's Name",o.buyerName,'buyerName')}
        </div></div>
        <div class="line-items-wrap"><div class="sec-title" style="margin-bottom:14px">Line Items</div><div id="linesContainer">${linesHTML}</div></div>
      </div>
      ${o.id?auditPanelHTML('order',o.id):''}`;
  }

  // Wizard mode — show current step content + summary panel
  let stepContent='';
  if(step===1)stepContent=headerSection;
  else if(step===2)stepContent=lineItemsSection;
  else if(step===3)stepContent=reviewSection;

  return`${banners}
    <div class="wiz-shell">
      <div class="wiz-main">
        ${stepIndicator}
        ${stepContent}
        ${wizNav}
        ${o.id?auditPanelHTML('order',o.id):''}
      </div>
      ${summaryPanel}
    </div>`;
}


function shipmentFormHTML(){
  const isView=S.page==='view-shipment';
  const ro=isView;
  const staffPartial=S.page==='edit-shipment'&&S.user?.role==='Staff';
  const roHdr=(f)=>ro||(staffPartial&&!['trackingNo'].some(k=>f===k||f.endsWith('.'+k)));
  const roLine=(f)=>ro||(staffPartial&&!['deliveryStatus','deliveryDate','usInvoiceNo','heatNo'].some(k=>f===k||f.endsWith('.'+k)));
  const sh=S.editingShipment||{lines:[emptyShipLine(1)],kanban:false,location:'India',dateOfInvoice:today(),dateOfShipping:today()};

  // ── WIZARD STATE ──
  const useWizard=!isView;
  const step=useWizard?(S.shipWizStep||1):null;
  const STEPS=['Shipment Header','Line Items','Review & Save'];

  // ── FIELD HELPERS ──
  function fld(l,v,f,opts={}){
    const isRo=opts.hdr?roHdr(f):opts.line?roLine(f):(ro||opts.ro||false);
    return`<div class="fg"><label>${l}</label><input value="${esc(v??'')}" ${isRo?'readonly':''} ${f?`data-sf="${esc(f)}"`:''} ></div>`;
  }
  function dateFld(l,v,f,opts={}){
    const isRo=opts.hdr?roHdr(f):opts.line?roLine(f):ro;
    if(isRo)return`<div class="fg"><label>${l}</label><input readonly value="${esc(fmtDate(v))}"></div>`;
    return`<div class="fg"><label>${l}</label><input type="date" value="${esc(v||'')}" data-sf="${esc(f)}"></div>`;
  }
  function selFld(l,v,opts,f,lineField=false){
    const isRo=lineField?roLine(f):roHdr(f);
    if(isRo)return fld(l,v,f,{line:lineField,hdr:!lineField});
    return`<div class="fg"><label>${l}</label><select data-sf="${esc(f)}">${opts.map(op=>`<option${op===v?' selected':''}>${esc(op)}</option>`).join('')}</select></div>`;
  }

  // ── LINE ITEMS HTML ──
  const allPOs=allOrderPONos();
  const linesHTML=(sh.lines||[]).map((l,i)=>{
    const linkedOrder=S.orders.find(o=>o.customerPONo===l.customerPONo);
    const poPartNos=linkedOrder?[...new Set(linkedOrder.lines.map(ln=>ln.partNo).filter(Boolean))]:[];
    const matchingOrderLines=linkedOrder?linkedOrder.lines.filter(ln=>ln.partNo===l.partNo):[];
    const orderLineNoField=ro||staffPartial
      ?(l.orderLineNo!=null?`<div class="fg"><label>Order Line No</label><input readonly value="Line ${l.orderLineNo} (${esc(l.partNo)})"></div>`:'')
      :`<div class="fg"><label>Order Line No <span style="font-size:11px;color:var(--purple);font-weight:600;background:var(--purple-l);border-radius:4px;padding:1px 5px">KEY</span></label><select data-sf="slines.${i}.orderLineNo" class="part-line-sel" data-li="${i}" id="shipLineNoSel${i}"><option value="">— Select after Part No —</option>${matchingOrderLines.map(ol=>`<option value="${ol.lineNo}"${ol.lineNo===l.orderLineNo?' selected':''}>Line ${ol.lineNo} (PO Qty: ${ol.poQty})</option>`).join('')}</select></div>`;
    return`<div class="line-item" data-sli="${i}">
      <div class="li-header">
        <span class="li-no">Line Item ${i+1}</span>
        ${!ro&&!staffPartial&&(sh.lines.length>1)?`<button class="btn btn-danger btn-sm" data-action="removeShipLine" data-li="${i}">Remove</button>`:''}
      </div>
      ${!ro&&!staffPartial?`<div style="background:var(--accent-l);border:1px solid #bfdbfe;border-radius:var(--rs);padding:8px 12px;margin-bottom:12px;font-size:11px;color:var(--accent)">
        <strong>Step 1:</strong> Customer PO No &nbsp;→&nbsp; <strong>Step 2:</strong> Part No &nbsp;→&nbsp; <strong>Step 3:</strong> Order Line No
      </div>`:''}
      ${staffPartial?`<div style="background:var(--accent-l);border:1px solid #bfdbfe;border-radius:var(--rs);padding:8px 12px;margin-bottom:12px;font-size:11px;color:var(--accent)">You can update: <strong>Delivery Status</strong>, <strong>Delivery Date</strong>, <strong>US Invoice No</strong>, <strong>Heat No</strong>.</div>`:''}
      <div class="grid3">
        ${fld('Line No',l.lineNo,`slines.${i}.lineNo`,{line:true})}
        ${roLine('customerPONo')?fld('Customer PO No',l.customerPONo,`slines.${i}.customerPONo`,{line:true})
          :`<div class="fg"><label>Customer PO No</label><select data-sf="slines.${i}.customerPONo" class="po-sel" data-li="${i}">${allPOs.map(p=>`<option value="${esc(p)}"${p===l.customerPONo?' selected':''}>${esc(p)}</option>`).join('')}</select></div>`}
        ${roLine('partNo')?fld('Part No',l.partNo,`slines.${i}.partNo`,{line:true})
          :poPartNos.length?`<div class="fg"><label>Part No</label><select data-sf="slines.${i}.partNo" class="part-sel" data-li="${i}">${poPartNos.map(p=>`<option value="${esc(p)}"${p===l.partNo?' selected':''}>${esc(p)}</option>`).join('')}</select></div>`
          :fld('Part No',l.partNo,`slines.${i}.partNo`,{line:true})}
        ${orderLineNoField}
        <div class="fg"><label>Shipped Qty</label><input value="${esc(l.shippedQty??0)}" ${roLine('shippedQty')?'readonly':''} data-sf="slines.${i}.shippedQty"></div>
        ${roLine('shippedTo')?fld('Shipped To',l.shippedTo,`slines.${i}.shippedTo`,{line:true})
          :`<div class="fg"><label>Shipped To</label><select data-sf="slines.${i}.shippedTo">${S.customers.map(c=>`<option value="${esc(c.name)}"${c.name===l.shippedTo?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`}
        ${selFld('Delivery Status',l.deliveryStatus,DELIVERY_STATUSES,`slines.${i}.deliveryStatus`,true)}
        ${dateFld('Delivery Date',l.deliveryDate,`slines.${i}.deliveryDate`,{line:true})}
        ${fld('US Invoice No',l.usInvoiceNo,`slines.${i}.usInvoiceNo`,{line:true})}
        ${fld('Heat No',l.heatNo,`slines.${i}.heatNo`,{line:true})}
      </div>
    </div>`;
  }).join('');

  // ── SUMMARY PANEL ──
  const totalShippedQty=(sh.lines||[]).reduce((s,l)=>s+(+l.shippedQty||0),0);
  const lineCount=(sh.lines||[]).length;
  const deliveredCount=(sh.lines||[]).filter(l=>l.deliveryStatus==='Delivered').length;
  const inTransitCount=(sh.lines||[]).filter(l=>l.deliveryStatus==='In Transit').length;
  const summaryPanel=useWizard?`<div class="wiz-summary">
    <div class="wiz-summary-title">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      Shipment Summary
    </div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Invoice No</span><span class="wiz-summary-val">${esc(sh.shippingInvoiceNo||'—')}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">GST No</span><span class="wiz-summary-val">${esc(sh.gstInvoiceNo||'—')}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Ship Date</span><span class="wiz-summary-val">${fmtDate(sh.dateOfShipping)||'—'}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Location</span><span class="wiz-summary-val">${esc(sh.location||'—')}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Kan-Ban</span><span class="wiz-summary-val">${sh.kanban?'Yes':'No'}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Logistics</span><span class="wiz-summary-val">${esc(sh.logistics||'—')}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Tracking #</span><span class="wiz-summary-val">${esc(sh.trackingNo||'—')}</span></div>
    <div class="wiz-summary-divider"></div>
    <div class="wiz-summary-section">Lines</div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Total Lines</span><span class="wiz-summary-val">${lineCount}</span></div>
    <div class="wiz-summary-row"><span class="wiz-summary-label">Total Qty</span><span class="wiz-summary-val">${totalShippedQty.toLocaleString()} pcs</span></div>
    ${deliveredCount?`<div class="wiz-summary-row"><span class="wiz-summary-label">Delivered</span><span class="wiz-summary-val" style="color:var(--success)">${deliveredCount} line${deliveredCount>1?'s':''}</span></div>`:''}
    ${inTransitCount?`<div class="wiz-summary-row"><span class="wiz-summary-label">In Transit</span><span class="wiz-summary-val" style="color:var(--warn)">${inTransitCount} line${inTransitCount>1?'s':''}</span></div>`:''}
  </div>`:'';

  // ── STEP INDICATOR ──
  const stepIndicator=useWizard?`<div class="wiz-steps">
    ${STEPS.map((label,idx)=>{
      const sNum=idx+1;
      const isDone=step>sNum;
      const isActive=step===sNum;
      return`<div class="wiz-step${isActive?' active':isDone?' done':''}" onclick="S.shipWizStep=${sNum};S.editingShipment=collectShipmentForm();render()">
        <div class="wiz-step-num">${isDone?'✓':sNum}</div>
        <span class="wiz-step-label">${label}</span>
      </div>`;
    }).join('')}
  </div>`:'';

  // ── STEP 1: SHIPMENT HEADER ──
  const headerSection=`<div class="form-card">
    <div class="form-section">
      <div class="sec-title">Shipment Header</div>
      <div class="grid3">
        ${fld('Shipping Invoice No *',sh.shippingInvoiceNo,'shippingInvoiceNo',{hdr:true})}
        ${fld('GST Invoice No',sh.gstInvoiceNo,'gstInvoiceNo',{hdr:true})}
        ${dateFld('Date of Invoice',sh.dateOfInvoice,'dateOfInvoice',{hdr:true})}
        ${dateFld('Date of Shipping',sh.dateOfShipping,'dateOfShipping',{hdr:true})}
        ${fld('Transport Method',sh.transportMethod,'transportMethod',{hdr:true})}
        ${fld('Logistics',sh.logistics,'logistics',{hdr:true})}
        ${fld('Tracking # / Airwaybill No',sh.trackingNo,'trackingNo',{hdr:true})}
        ${fld('Customs House Agent',sh.customsHouseAgent,'customsHouseAgent',{hdr:true})}
        <div class="fg"><label>Kan-Ban</label>
          <div class="toggle-wrap">
            <label class="toggle">
              <input type="checkbox" id="kanbanToggle" data-sf="kanban" ${sh.kanban?'checked':''} ${roHdr('kanban')?'disabled':''}>
              <span class="toggle-track"></span>
            </label>
            <span class="toggle-lbl" id="kanbanLbl">${sh.kanban?'Yes':'No'}</span>
          </div>
        </div>
        ${selFld('Location',sh.location,LOCATIONS,'location',false)}
      </div>
    </div>
  </div>`;

  // ── STEP 2: LINE ITEMS ──
  const lineItemsSection=`<div class="form-card">
    <div class="line-items-wrap">
      <div class="sec-title" style="margin-bottom:14px">Shipment Line Items</div>
      <div id="shipLinesContainer">${linesHTML}</div>
      ${!ro&&!staffPartial?`<button class="add-line" id="addShipLineBtn">+ Add Line Item</button>`:''}
    </div>
  </div>`;

  // ── STEP 3: REVIEW & SAVE ──
  const reviewSection=(()=>{
    const rFld=(label,val)=>`<div class="review-field-row"><div class="review-field-label">${label}</div><div class="review-field-val">${esc(String(val||'—'))}</div></div>`;
    return`<div class="form-card">
      <div class="form-section">
        <div class="sec-title">Shipment Header — Review</div>
        <div class="review-header-grid">
          ${rFld('Shipping Invoice No',sh.shippingInvoiceNo)}
          ${rFld('GST Invoice No',sh.gstInvoiceNo)}
          ${rFld('Date of Invoice',fmtDate(sh.dateOfInvoice))}
          ${rFld('Date of Shipping',fmtDate(sh.dateOfShipping))}
          ${rFld('Transport Method',sh.transportMethod)}
          ${rFld('Logistics',sh.logistics)}
          ${rFld('Tracking #',sh.trackingNo)}
          ${rFld('Customs House Agent',sh.customsHouseAgent)}
          ${rFld('Location',sh.location)}
          ${rFld('Kan-Ban',sh.kanban?'Yes':'No')}
        </div>
      </div>
      <div class="form-section">
        <div class="sec-title">Line Items — Review</div>
        ${(sh.lines||[]).map((l,i)=>{
          const statusBadge=l.deliveryStatus==='Delivered'?'b-green':l.deliveryStatus==='In Transit'?'b-yellow':'b-gray';
          return`<div class="review-line-card">
            <div class="review-line-title">
              Line Item ${i+1}
              <span class="badge ${statusBadge}">${esc(l.deliveryStatus||'—')}</span>
              <span style="font-family:Inter,sans-serif;font-size:11px;color:var(--muted)">${esc(l.partNo||'—')}</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
              <div class="review-field-row"><div class="review-field-label">Customer PO No</div><div class="review-field-val">${esc(l.customerPONo||'—')}</div></div>
              <div class="review-field-row"><div class="review-field-label">Part No</div><div class="review-field-val">${esc(l.partNo||'—')}</div></div>
              <div class="review-field-row"><div class="review-field-label">Order Line No</div><div class="review-field-val">${l.orderLineNo!=null?'Line '+l.orderLineNo:'Not set'}</div></div>
              <div class="review-field-row"><div class="review-field-label">Shipped Qty</div><div class="review-field-val">${l.shippedQty||0} pcs</div></div>
              <div class="review-field-row"><div class="review-field-label">Shipped To</div><div class="review-field-val">${esc(l.shippedTo||'—')}</div></div>
              <div class="review-field-row"><div class="review-field-label">Delivery Status</div><div class="review-field-val">${esc(l.deliveryStatus||'—')}</div></div>
              <div class="review-field-row"><div class="review-field-label">Delivery Date</div><div class="review-field-val">${fmtDate(l.deliveryDate)||'—'}</div></div>
              <div class="review-field-row"><div class="review-field-label">US Invoice No</div><div class="review-field-val">${esc(l.usInvoiceNo||'—')}</div></div>
              <div class="review-field-row"><div class="review-field-label">Heat No</div><div class="review-field-val">${esc(l.heatNo||'—')}</div></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  })();

  // ── STAFF BANNER ──
  const staffBanner=staffPartial?`<div style="background:var(--accent-l);border:1px solid #bfdbfe;border-radius:var(--rs);padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--accent);display:flex;align-items:center;gap:8px">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
    <span><strong>Staff Update Mode:</strong> You can update <strong>Tracking #</strong> (header) and per line: <strong>Delivery Status</strong>, <strong>Delivery Date</strong>, <strong>US Invoice No</strong>, <strong>Heat No</strong>.</span>
  </div>`:'';

  // ── WIZARD NAV ──
  const wizNav=useWizard?`<div class="wiz-nav">
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary btn-sm" id="backShipBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        ${step===1?'Cancel':'Back'}
      </button>
      ${step>1?`<button class="btn btn-secondary btn-sm" id="shipWizPrevBtn">← Previous Step</button>`:''}
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span style="font-size:12px;color:var(--muted)">Step ${step} of ${STEPS.length}</span>
      ${step<STEPS.length?`<button class="btn btn-purple btn-sm" id="shipWizNextBtn">Next Step →</button>`:''}
      ${step===STEPS.length&&(!ro||staffPartial)?`<button class="btn btn-purple btn-sm" id="saveShipBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
        Save Shipment${staffPartial?' (Delivery Update)':''}
      </button>`:''}
    </div>
  </div>`:'';

  // ── VIEW MODE ACTION BUTTONS ──
  const viewActions=isView?`<div class="form-actions">
    <button class="btn btn-secondary btn-sm" id="backShipBtn">Back</button>
  </div>`:'';

  // ── ASSEMBLE ──
  if(isView){

function dupPOWarning(o){
  const po=String(o.customerPONo||'').trim().toLowerCase();if(!po||S.page!=='new-order')return'';
  const dup=S.orders.some(x=>x.id!==o.id&&String(x.customerPONo||'').trim().toLowerCase()===po&&x.customerName===o.customerName);
  return dup?`<br><br><strong style="color:#B91C1C">⚠ ${esc(o.customerName||'This customer')} already has a PO numbered ${esc(o.customerPONo)}.</strong> Save only if this is intended.`:'';
}
function overShipWarning(sh){
  const agg={};(sh.lines||[]).forEach(l=>{if(!l.customerPONo||!l.partNo)return;const k=l.customerPONo+'||'+l.partNo;agg[k]=(agg[k]||0)+(+l.shippedQty||0);});
  const w=[];
  Object.keys(agg).forEach(k=>{
    const [po,part]=k.split('||');const o=S.orders.find(x=>x.customerPONo===po);if(!o)return;
    const cap=o.lines.filter(l=>l.partNo===part&&(l.lineStatus||'Open')!=='Cancelled').reduce((a,l)=>a+calcLine(l).effectiveQty,0);
    let other=0;S.shipments.forEach(x=>{if(x.id===sh.id)return;(x.lines||[]).forEach(l=>{if(l.customerPONo===po&&l.partNo===part)other+=(+l.shippedQty||0);});});
    if(other+agg[k]>cap)w.push(`${esc(po)} / ${esc(part)}: shipping ${agg[k]} + already shipped ${other} is more than the ${cap} ordered`);
  });
  return w.length?`<br><br><strong style="color:#B91C1C">⚠ Over-shipping:</strong><br>${w.join('<br>')}<br>Save only if this is intended.`:'';
}

function collectShipmentForm(){const sh=cloneObj(S.editingShipment||{lines:[],kanban:false});document.querySelectorAll('[data-sf]').forEach(el=>{const f=el.dataset.sf;if(!f)return;let val=el.type==='checkbox'?el.checked:el.value;if(f.startsWith('slines.')){const pts=f.split('.');const idx=parseInt(pts[1]);const sub=pts[2];while(sh.lines.length<=idx)sh.lines.push(emptyShipLine(sh.lines.length+1));if(sub==='shippedQty')sh.lines[idx][sub]=parseFloat(val)||0;else if(sub==='orderLineNo')sh.lines[idx][sub]=val===''?null:parseInt(val);else sh.lines[idx][sub]=val;}else sh[f]=val;});return sh;}

async function toBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(new Error('Read failed'));r.readAsDataURL(file);});}
async function extractWithClaude(file){
  const base64=await toBase64(file);
  const isPDF=file.type==='application/pdf';
  const mediaType=isPDF?'application/pdf':file.type;
  const systemPrompt=`You are a PO data extraction assistant. Extract structured data from the document and return ONLY valid JSON with no markdown, no backticks, no preamble. Return this exact structure:
{"customerName":null,"orderDate":null,"customerPONo":null,"buyerName":null,"blanketOrderNo":null,"lines":[{"partNo":null,"poQty":null,"originalDockDate":null,"inTransitDays":null,"conf":{"partNo":"high|low|null","poQty":"high|low|null","originalDockDate":"high|low|null","inTransitDays":"high|low|null"}}],"conf":{"customerName":"high|low|null","orderDate":"high|low|null","customerPONo":"high|low|null","buyerName":"high|low|null","blanketOrderNo":"high|low|null"}}
Dates must be YYYY-MM-DD. Use "high" confidence for clearly printed fields, "low" for handwritten/ambiguous, null if not found.`;
  const userContent=isPDF
    ?[{type:'document',source:{type:'base64',media_type:mediaType,data:base64}},{type:'text',text:'Extract all PO fields from this document.'}]
    :[{type:'image',source:{type:'base64',media_type:mediaType,data:base64}},{type:'text',text:'Extract all PO fields from this document.'}];
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,system:systemPrompt,messages:[{role:'user',content:userContent}]})});
  if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err?.error?.message||`API error ${res.status}`);}
  const data=await res.json();
  const text=data.content?.map(b=>b.text||'').join('')||'';
  const clean=text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
}
